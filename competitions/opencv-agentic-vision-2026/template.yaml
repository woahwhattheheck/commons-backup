AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ProofLens evidence-first OpenCV 5 inspection agent

Resources:
  ImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  EvidenceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ReviewQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 60
      MessageRetentionPeriod: 1209600

  InspectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: aws_agent.lambda_handler
      Runtime: python3.12
      Architectures:
        - arm64
      MemorySize: 1024
      Timeout: 30
      Environment:
        Variables:
          PROOFLENS_BUCKET: !Ref ImageBucket
          PROOFLENS_TABLE: !Ref EvidenceTable
          PROOFLENS_REVIEW_QUEUE_URL: !Ref ReviewQueue
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ImageBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref EvidenceTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ReviewQueue.QueueName
      Events:
        CurrentObjectCreated:
          Type: S3
          Properties:
            Bucket: !Ref ImageBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: current/

Outputs:
  BucketName:
    Description: Versioned bucket for baseline/ and current/ images
    Value: !Ref ImageBucket
  EvidenceTableName:
    Value: !Ref EvidenceTable
  ReviewQueueUrl:
    Value: !Ref ReviewQueue
  InspectorFunctionName:
    Value: !Ref InspectorFunction
