AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Optional SpoilerShield context-only Bedrock backend.
Parameters:
  BedrockModelId:
    Type: String
    Description: Bedrock model ID selected by the operator. Leave blank for deterministic offline mode.
    Default: ''
  AllowedTranscriptSha256:
    Type: String
    Description: Optional exact transcript generation digest for a fixed demo package.
    Default: ''
Resources:
  ContextFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      CodeUri: .
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          ALLOWED_TRANSCRIPT_SHA256: !Ref AllowedTranscriptSha256
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: '*'
      Events:
        ContextApi:
          Type: HttpApi
          Properties:
            Path: /context
            Method: POST
Outputs:
  ContextApi:
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/context'
