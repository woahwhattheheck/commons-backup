[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tencent-aspire-internal-brain"
version = "0.4.0"
description = "Deterministic enterprise knowledge reference engine with fail-closed RBAC, provenance, and tamper-evident audit receipts"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
internal-brain = "internal_brain.cli:main"
internal-brain-web = "internal_brain.web_demo:main"
internal-brain-context = "internal_brain.assistant_context:main"

[tool.setuptools]
packages = ["internal_brain"]
