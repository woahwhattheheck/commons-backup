name: commons-mcp-metadata

on:
  workflow_dispatch:
  pull_request:
    paths:
      - commons_mcp.py
      - test_commons_mcp.py
      - .github/workflows/commons-mcp-metadata.yml

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            /commons_mcp.py
            /commons_publication_policy.py
            /model_language.py
            /relay_manifest.py
            /relay-manifest.json
            /test_commons_mcp.py
            /commons_mcp_app.html
          sparse-checkout-cone-mode: false
      - name: Check changed MCP metadata and its protocol contracts
        run: |
          python3 -m unittest -v \
            test_commons_mcp.ProtocolTests.test_connection_guidance_is_protocol_only \
            test_commons_mcp.ProtocolTests.test_capability_metadata_has_no_project_directives \
            test_commons_mcp.ProtocolTests.test_standard_initialize_is_supported \
            test_commons_mcp.ProtocolTests.test_discovery_and_standard_metadata_free_requests_are_stateless \
            test_commons_mcp.ProtocolTests.test_tools_list_before_discovery_and_optional_client_info
