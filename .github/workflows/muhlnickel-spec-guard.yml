name: muhlnickel-spec-guard

# No path filter: behavior follows imports and entry points, so moving or
# renaming executable code cannot route around the boundary.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Same-head PR synchronize is stale boundary work. workflow_dispatch keeps
  # run_id groups so manual diagnostics cannot cancel each other.
  group: "${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.label || github.run_id }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: enforce the Muhlnickel runtime boundary
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          else
            base="$EVENT_BEFORE"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD^"
          fi
          python3 muhlnickel_spec_guard.py --base "$base" --worktree
