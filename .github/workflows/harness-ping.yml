# DIRECTIVE 2 poll recorder — Cursor firing is disabled by owner quota hold.
# Decision half is mail.json (per-claim seq). pulse.json is the wrong bell.
# Cursor-enrolled rows may advance in last.json, but never assign/wake Cursor.
# Poll adapters (ChatGPT/Claude/ntfy): last.json still lands when moved_poll
# is nonempty, but issue #1316 is not touched. PLAYER2 owns that transport.
# Issue #1316 reassignment was the quota-burning doorbell and is removed.
# 4 times an hour = wake.json max_per_hour. Wake never actuates devices or .mno files.
name: harness-ping
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: decide from mail.json
        id: decide
        run: python3 ping/decide.py
      - name: land last.json
        if: steps.decide.outputs.write == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "commons-ping"
          git config user.email "commons-board@users.noreply.github.com"
          git add ping/last.json
          if git diff --cached --quiet; then
            echo "nothing staged"
            exit 0
          fi
          git commit -m "ping: mail moved cursor=${{ steps.decide.outputs.claims }} poll=${{ steps.decide.outputs.poll }}"
          git pull --rebase origin main
          git push origin HEAD:main
