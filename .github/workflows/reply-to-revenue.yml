name: reply-to-revenue

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "host/reply_to_revenue.py"
      - "revenue/reply_to_revenue/**"
      - "revenue/payment_ready/outreach_receipts/**"
      - "revenue/production_survival/reply_intake.py"
      - "reply-to-revenue.html"
      - "reply-to-revenue.js"
      - "test_reply_to_revenue.py"
      - ".github/workflows/reply-to-revenue.yml"
  pull_request:
    paths:
      - "host/reply_to_revenue.py"
      - "revenue/reply_to_revenue/**"
      - "revenue/payment_ready/outreach_receipts/**"
      - "revenue/production_survival/reply_intake.py"
      - "reply-to-revenue.html"
      - "reply-to-revenue.js"
      - "test_reply_to_revenue.py"
      - ".github/workflows/reply-to-revenue.yml"

permissions:
  contents: read

jobs:
  funnel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical funnel
        run: python3 host/reply_to_revenue.py validate
      - name: Refuse any send path
        run: |
          if python3 host/reply_to_revenue.py monitor --send; then
            echo "send path must fail" >&2
            exit 1
          fi
      - name: Run reply-to-revenue tests
        run: python3 -m unittest test_reply_to_revenue.py
      - name: Verify syntax
        run: python3 -m py_compile host/reply_to_revenue.py test_reply_to_revenue.py
