# repo-pulse — lossless 5-minute change index for main, posted to Slack.
#
# The engine lives in repo_pulse.py (imported by test_repo_pulse.py). This
# workflow fetches those two files over the API so it never clones the ~1GB
# tree. Cursor state is a cache, not a commit: committing evidence onto main
# would make the pulse appear in its own next pulse.
#
# LOOP SAFETY — do not remove the COMMONS_SLACK_MIRROR header the engine
# emits. slack_ingest.should_skip() refuses that claim, so the digest cannot
# create a board issue that becomes the next digest, forever.
#
# Owner contract: every scheduled quiet window is data and posts one compact line.
# Until SLACK_WEBHOOK_URL exists the digest goes to the job summary instead
# of failing, so the schedule can be live before the credential is.
#
# Sprint integration (additive): the engine teaches MERGE DEFAULT and lists
# CLEAR_TO_MERGE / COMPOSE_AND_MERGE / DEDUPED / CONFLICT with exact evidence.
# host/sprint_integration.py is fetched next to the engine so the checker
# cannot drift. Policy: ground/SPRINT_INTEGRATION.json. Does not change
# CLEAR/ATTENTION/BROKEN. PULSE_REPORT_IDLE stays true.
name: repo-pulse

on:
  schedule:
    # Offset off :00 — GitHub delays scheduled runs hardest at the top of the hour.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render to the job log instead of posting to Slack"
        type: boolean
        default: false
  pull_request:
    paths:
      - "slack_ingest.py"
      - "test_slack_ingest.py"
      - "exact_body_redact.py"
      - "repo_pulse.py"
      - "test_repo_pulse.py"
      - "host/sprint_integration.py"
      - "test_sprint_integration.py"
      - "ground/SPRINT_INTEGRATION.json"
      - ".github/workflows/repo-pulse.yml"
  push:
    branches: [main]
    paths:
      - "slack_ingest.py"
      - "test_slack_ingest.py"
      - "exact_body_redact.py"
      - "repo_pulse.py"
      - "test_repo_pulse.py"
      - "host/sprint_integration.py"
      - "test_sprint_integration.py"
      - "ground/SPRINT_INTEGRATION.json"
      - ".github/workflows/repo-pulse.yml"

permissions:
  contents: read
  # slack_ingest creates ordinary label=board issues. The existing
  # commons-board schedule consumes them; no second publisher is minted here.
  issues: write
  pull-requests: read
  checks: read
  pages: read
  actions: read

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: repo-pulse
      cancel-in-progress: false
    steps:
      - name: Restore cursor from the previous run
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: .pulse-state.json
          key: repo-pulse-cursor-${{ github.run_id }}
          restore-keys: |
            repo-pulse-cursor-

      - name: Fetch engine, run fixtures, post digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          PULSE_STATE: .pulse-state.json
          PULSE_EVIDENCE: repo-pulse/latest.json
          PULSE_REPORT_IDLE: "true"
          PULSE_IDLE_HEARTBEAT_MINUTES: "60"
          PULSE_MAX_COMMIT_LINES: "8"
          PULSE_FALLBACK_MINUTES: "5"
          PULSE_DRY_RUN: ${{ (inputs.dry_run || github.event_name == 'pull_request') && 'true' || '' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pulse repo-pulse
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents"
          fetch() {
            mkdir -p "/tmp/pulse/$(dirname "$1")"
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github.raw" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "User-Agent: repo-pulse/2.1" \
              "${api}/$1?ref=${GITHUB_SHA}" -o "/tmp/pulse/$1"
          }
          fetch repo_pulse.py
          fetch test_repo_pulse.py
          fetch host/sprint_integration.py
          cp /tmp/pulse/host/sprint_integration.py /tmp/pulse/sprint_integration.py
          python3 /tmp/pulse/test_repo_pulse.py
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR dry-run: fixtures passed; skipping live digest so a preview cannot move the cursor."
            exit 0
          fi
          python3 /tmp/pulse/repo_pulse.py
          if [ -f repo-pulse/latest.json ]; then
            python3 -c "import json,sys; json.load(open('repo-pulse/latest.json')); print('evidence ok')"
          fi

      - name: Upload machine-readable evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: repo-pulse-latest
          path: repo-pulse/latest.json
          retention-days: 14
          if-no-files-found: warn

      - name: Save cursor for the next run
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .pulse-state.json
          key: repo-pulse-cursor-${{ github.run_id }}

  slack_ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: repo-pulse-slack-ingest
      cancel-in-progress: false
    steps:
      - name: Restore the last successful Slack event cursor
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: .slack-ingest-state.json
          key: slack-ingest-cursor-${{ github.run_id }}
          restore-keys: |
            slack-ingest-cursor-

      - name: Gate exhaustive scheduled scans to one per 25 minutes
        id: cadence
        shell: bash
        run: |
          run=true
          if [ "${{ github.event_name }}" = "schedule" ] && \
             [ -f .slack-ingest-state.json ] && \
             find .slack-ingest-state.json -mmin -25 -print -quit | grep -q .; then
            run=false
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"

      - name: Fetch exact engine bytes, run fixtures, and sync Slack
        id: sync
        if: steps.cadence.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          COMMONS_SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL_ID || 'C0BRGMDQB6G' }}
          SLACK_INGEST_STATE: .slack-ingest-state.json
        run: |
          set -euo pipefail
          mkdir -p /tmp/slack-ingest
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents"
          fetch() {
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github.raw" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "User-Agent: slack-ingest/1.0" \
              "${api}/$1?ref=${GITHUB_SHA}" -o "/tmp/slack-ingest/$1"
          }
          fetch exact_body_redact.py
          fetch slack_ingest.py
          fetch test_slack_ingest.py
          (
            cd /tmp/slack-ingest
            python3 -m unittest -v test_slack_ingest.py
          )
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR dry-run: Slack ingest fixtures passed; no live cursor or issue write."
            echo "state_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${SLACK_BOT_TOKEN}" ]; then
            echo "Slack ingest idle: SLACK_BOT_TOKEN is not configured."
            echo "state_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "${SLACK_INGEST_STATE}" ]; then
            # Bootstrap once from the SHA-pinned durable projection. Future
            # runs use the exact cached Slack event clock and avoid a repo clone.
            fetch posts.json
          fi
          python3 /tmp/slack-ingest/slack_ingest.py sync \
            --state "${SLACK_INGEST_STATE}" \
            --posts-json /tmp/slack-ingest/posts.json
          echo "state_ready=true" >> "$GITHUB_OUTPUT"

      - name: Save the last fully processed Slack event cursor
        if: success() && steps.sync.outputs.state_ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: .slack-ingest-state.json
          key: slack-ingest-cursor-${{ github.run_id }}
