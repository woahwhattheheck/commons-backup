  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Same-head PR synchronize is stale battery work. Unique push/main and
  # workflow_dispatch keep run_id groups so they cannot cancel each other.
  group: "${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.label || github.run_id }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Several live-tree contracts classify exact ancestors and inspect
          # historical source objects. A depth-1 checkout turns those lawful
          # lookups into FOREIGN/NOT_LANDED false negatives.
          fetch-depth: 0

      - name: the whole battery, one failure fails the run
        run: |
          set -u
          fail=0
          # DISCOVERED, NOT LISTED. This was a hand-maintained list of filenames,
          # and on 2026-08-20 three tests landed in one evening that the list did
          # not name -- test_heal_recordless, test_echo_skip's neighbours, and
          # test_permalink_follows_file -- so CI ran 16, 17, 18 of them while 17,
          # 18, 19 sat on disk. Each was caught by a window happening to look.
          # The window that writes a test is the LEAST likely to notice it never
          # ran: they ran it by hand, it passed, and the list is a separate file
          # they had no reason to open. A list that must be edited in a second
          # place is a list that silently drifts, and this file exists precisely
          # because "a test nobody runs is a comment".
          # Globbing cannot drift. Adding test_foo.py is now the whole of wiring
          # it in. The count guard below still catches a DELETED test, which is
          # the failure mode a glob cannot see.
          python_tests=()
          while IFS= read -r -d '' t; do
            python_tests+=("$t")
          done < <(
            {
              find . -maxdepth 1 -type f -name 'test_*.py' -print0
              find infra -type f -name 'test_*.py' -print0
            } | sort -z
          )
          if [ "${#python_tests[@]}" -eq 0 ]; then
            echo "::warning::no python tests matched"
          fi
          for t in "${python_tests[@]}"; do
            # every test runs even after one fails: a single red should not
            # hide the other seven, or the next window fixes one thing at a time
            if python3 "$t"; then
              echo "ok   $t"
            else
              echo "::error::$t FAILED"
              fail=1
            fi
          done
          for t in test_*.js; do
            [ -f "$t" ] || { echo "::warning::no node tests matched"; continue; }
            if node "$t"; then
              echo "ok   $t"
            else
              echo "::error::$t FAILED"
              fail=1
            fi
          done
          exit "$fail"

      - name: a test file that vanished is a hole, not a pass
        run: |
          # Deleting a test is the cheapest way to make CI green and the most
          # expensive mistake in the repo. Report it loudly; the battery above
          # already skips-with-warning rather than silently shrinking.
          n=$(
            {
              find . -maxdepth 1 -type f \( -name 'test_*.py' -o -name 'test_*.js' \) -print
              find infra -type f -name 'test_*.py' -print
            } | wc -l
          )
          echo "test files present: $n"
          if [ "$n" -lt 21 ]; then
            echo "::warning::only $n test files found; the battery was 21. A test was removed or renamed."
            {
              echo "## TEST COUNT DROPPED"
              echo "Found **$n** test files; the battery was 21."
              echo "If this was intentional, say so on the board with the id that authorised it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
