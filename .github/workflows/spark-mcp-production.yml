# Keep production Commons MCP at https://commons-spark-mcp.vercel.app/mcp
# identical to current main. Manual Aug-25 deploys went stale; this is the
# no-click road after VERCEL_TEAM_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID
# exist. VERCEL_TOKEN (project-scoped newer format) is rejected by Vercel CLI
# 56.x/59.x; deploy auth is the team-scoped CLI-compatible secret only.
# Vercel CLI 56.1.0 .vercelignore does not honor directory un-ignores after
# * or /* (runs 33218271833 and 33219467177 uploaded 7 root files and
# dropped api/mcp.py). Stage the runtime graph with
# stage_spark_mcp_bundle.py and deploy that directory. Hobby cap 5000.
#
# Queue fuse: path-filter only MCP production source. Do not add p/**,
# llms.txt, board.md, posts.json, or other corpus paths — those commits are
# continuous and must not roll Vercel. Unique board/job events stay on their
# own workflows. Finish active main deployments; coalesce pending updates.
#
# Deployment runs the real live MCP discovery; it starts no model jobs.
name: spark-mcp-production

on:
  push:
    branches:
      - main
    paths:
      - "api/mcp.py"
      - "api/owner_context.py"
      - "api/jev.py"
      - "api/cua_s1.py"
      - "api/cua_s1_form.mjs"
      - "api/cua_s1_fixture.mjs"
      - "host/jev.py"
      - "host/cua_s1_cloud/**"
      - "requirements.txt"
      - "package.json"
      - "package-lock.json"
      - "commons_mcp.py"
      - "commons_publication_policy.py"
      - "webmcp.html"
      - "vercel.json"
      - ".vercelignore"
      - "stage_spark_mcp_bundle.py"
      - "carriers/**"
      - "harnesses/**"
      - "host/observatory.py"
      - "integrations/grokcom_revenue/**"
      - "model_language.py"
      - "relay_manifest.py"
      - "relay-manifest.json"
      - "protocol/**"
      - ".github/workflows/spark-mcp-production.yml"
  workflow_dispatch:

concurrency:
  group: spark-mcp-production-main
  # A steady stream of source changes must not starve production deployment.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TEAM_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      VERCEL_PROJECT_NAME: commons-spark-mcp
      VERCEL_SCOPE: woahwhatthehecks-projects
      PUBLIC_MCP_URL: https://commons-spark-mcp.vercel.app/mcp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: detect Vercel credentials without printing values
        id: creds
        run: |
          set -euo pipefail
          if [ -n "${VERCEL_TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TEAM_TOKEN present (value not printed)"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "## spark-mcp-production skipped"
              echo
              echo "VERCEL_TEAM_TOKEN is not present in GitHub Actions secrets."
              echo
              echo "Exact UI action: open"
              echo "https://github.com/woahwhattheheck/commons/settings/secrets/actions"
              echo "→ New repository secret, and add these three names"
              echo "(values from Vercel, never from chat or git):"
              echo
              echo "1. \`VERCEL_TEAM_TOKEN\` — Vercel → Account Settings → Tokens → Create (team-scoped CLI-compatible token)"
              echo "2. \`VERCEL_ORG_ID\` — Vercel → commons-spark-mcp → Settings → General"
              echo "3. \`VERCEL_PROJECT_ID\` — same General page"
              echo
              echo "Then re-run this workflow on main (Actions → spark-mcp-production → Run workflow)."
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: "22"

      - name: deploy current main to commons-spark-mcp production
        if: steps.creds.outputs.present == 'true'
        run: |
          set -euo pipefail
          npm install --global vercel@56.1.0
          mkdir -p .vercel
          if [ -n "${VERCEL_ORG_ID}" ] && [ -n "${VERCEL_PROJECT_ID}" ]; then
            python3 - <<'PY'
          import json, os, pathlib
          pathlib.Path(".vercel").mkdir(exist_ok=True)
          pathlib.Path(".vercel/project.json").write_text(
              json.dumps({
                  "orgId": os.environ["VERCEL_ORG_ID"],
                  "projectId": os.environ["VERCEL_PROJECT_ID"],
              }),
              encoding="utf-8",
          )
          PY
          else
            vercel link --yes --token="${VERCEL_TOKEN}" --project "${VERCEL_PROJECT_NAME}" --scope "${VERCEL_SCOPE}"
          fi
          if [ -z "${TYPESAFE_API_KEY}" ]; then
            echo "::error::TYPESAFE_API_KEY is missing from repository Actions secrets."
            exit 1
          fi
          if vercel env ls production --token="${VERCEL_TOKEN}" --scope "${VERCEL_SCOPE}" | grep -Fq 'TYPESAFE_API_KEY'; then
            echo "TYPESAFE_API_KEY production variable already configured (value not read)"
          else
            printf '%s' "${TYPESAFE_API_KEY}" | vercel env add TYPESAFE_API_KEY production --sensitive --token="${VERCEL_TOKEN}" --scope "${VERCEL_SCOPE}"
            echo "TYPESAFE_API_KEY production variable configured (value not printed)"
          fi
          STAGE="$(mktemp -d)"
          python3 stage_spark_mcp_bundle.py --src . --dst "${STAGE}"
          if [ -d .vercel ]; then
            cp -a .vercel "${STAGE}/.vercel"
          fi
          (
            cd "${STAGE}"
            vercel deploy --prod --yes --token="${VERCEL_TOKEN}" | tee /tmp/vercel-deploy.log
          )
          {
            echo "## spark-mcp-production deployed"
            echo
            echo "SHA \`${GITHUB_SHA}\` → ${PUBLIC_MCP_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        if: steps.creds.outputs.present == 'true'
        with:
          python-version: "3.12"

      - name: wait for live initialize/tools-list parity
        if: steps.creds.outputs.present == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, time, urllib.request

          url = "https://commons-spark-mcp.vercel.app/mcp"
          import commons_mcp as cm
          want_version = cm.SERVER_VERSION
          want_tools = {
              "discover_commons_capabilities",
              "search_commons",
              "read_commons_resource",
              "route_grokcom_revenue_work",
              "post_to_action_pad",
              "jev_decide",
              "cua_s1_score",
          }
          headers = {
              "Content-Type": "application/json",
              "Accept": "application/json, text/event-stream",
              "MCP-Protocol-Version": "2025-03-26",
          }

          def rpc(method, params=None, request_id=1):
              payload = {"jsonrpc": "2.0", "id": request_id, "method": method}
              if params is not None:
                  payload["params"] = params
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers=headers,
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          last = None
          for attempt in range(18):
              try:
                  init = rpc(
                      "initialize",
                      {
                          "protocolVersion": "2025-03-26",
                          "capabilities": {},
                          "clientInfo": {"name": "spark-mcp-production", "version": "1"},
                      },
                  )
                  tools = rpc("tools/list", {}, request_id=2)
                  info = (init.get("result") or {}).get("serverInfo") or {}
                  rows = ((tools.get("result") or {}).get("tools") or [])
                  names = [row.get("name") for row in rows]
                  action_pad = next(
                      (row for row in rows if row.get("name") == "post_to_action_pad"),
                      {},
                  )
                  action_schema = action_pad.get("inputSchema") or {}
                  action_required = action_schema.get("required") or []
                  action_properties = action_schema.get("properties") or {}
                  credential_fields = sorted(
                      {"token", "auth", "permission"}.intersection(action_properties)
                  )
                  last = {
                      "version": info.get("version"),
                      "name": info.get("name"),
                      "tools": names,
                      "action_pad_required": action_required,
                      "action_pad_credential_fields": credential_fields,
                  }
                  print(
                      "live",
                      json.dumps(
                          {
                              "version": last["version"],
                              "tool_count": len(names),
                              "has_discovery": "discover_commons_capabilities" in names,
                              "has_action_pad": "post_to_action_pad" in names,
                              "action_pad_required": action_required,
                              "action_pad_credential_fields": credential_fields,
                          }
                      ),
                  )
                  mcp_ok = (
                      info.get("name") == "commons"
                      and info.get("version") == want_version
                      and want_tools.issubset(names)
                      and action_required == ["content"]
                      and not credential_fields
                  )
                  if mcp_ok:
                      door = urllib.request.Request(
                          "https://commons-spark-mcp.vercel.app/webmcp",
                          method="GET",
                      )
                      with urllib.request.urlopen(door, timeout=20) as resp:
                          ctype = resp.headers.get("content-type") or ""
                          body = resp.read()
                          html_ok = (
                              resp.status == 200
                              and "text/html" in ctype
                              and b"document.modelContext" in body
                          )
                          last["webmcp"] = {
                              "status": resp.status,
                              "ctype": ctype,
                              "bytes": len(body),
                              "html_ok": html_ok,
                          }
                      print("webmcp", json.dumps(last["webmcp"]))
                      if html_ok:
                          print("LIVE_SOURCE_PARITY")
                          print("LIVE_WEBMCP_HTML")
                          print("LIVE_ACTION_PAD_SCHEMA")
                          sys.exit(0)
              except Exception as exc:
                  last = {"error": str(exc)}
                  print("poll error", exc)
              time.sleep(10)
          print("STALE_OR_UNVERIFIED", json.dumps(last))
          sys.exit(1)
          PY
