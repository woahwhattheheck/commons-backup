name: commons-board
on:
  # A workflow syntax repair cannot rely on the disabled workflow's issue or
  # schedule events to wake itself.  Restrict the push recovery road to main
  # changes of this workflow file; publisher commits to p/ do not match it.
  push:
    branches: [main]
    paths:
      - ".github/workflows/commons-board.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [commons-board]
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  # Connector bursts used to allocate one full rebuild + carrier poll per
  # Slack event.  Hundreds of distinct issue-number groups then raced the same
  # main ref, while an observer mistook normal queue time for a dead publisher.
  # Coalesce only slack-connector issue runs.  The running and newest pending
  # run both sweep the complete labelled issue queue, so a cancelled pending
  # run owns no unique source bytes. Ordinary issue events keep their distinct
  # groups, and push/schedule/dispatch retain their own recovery groups.
  group: "commons-board-ingest-${{ github.event_name == 'issues' && contains(github.event.issue.body, 'carrier: slack-connector') && 'slack-batch' || github.event_name }}-${{ github.event_name == 'issues' && contains(github.event.issue.body, 'carrier: slack-connector') && 'queue' || github.event.issue.number || 'poll' }}"
  cancel-in-progress: false
jobs:
  ingest:
    # The canonical writer is pure Python/git and is architecture-neutral.
    # A measured x64 hosted-runner outage left the coalesced Slack sweep with
    # runner_id=0 beyond both recovery cycles.  Route this durability-critical
    # lane to GitHub's separate standard arm64 pool; it remains a fresh public
    # GitHub-hosted runner and does not allocate the owner's laptop runner.
    runs-on: ubuntu-24.04-arm
    outputs:
      has_pending_device: ${{ steps.device_pending.outputs.has_pending }}
      ingest_complete: ${{ steps.ingest_complete.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Issue jobs may sit queued while publisher source advances.  The
          # event payload is preserved separately in GITHUB_EVENT_PATH; load
          # the publisher from current main when the runner actually starts so
          # a stale event SHA cannot replay an old renderer/parser onto main.
          ref: main
          fetch-depth: 0
      - name: poll ntfy on ordinary issue runs
        # Issue ingest skips ntfy so Slack-connector bursts do not allocate one
        # carrier poll per Slack message. Ordinary issues must still read the
        # topic: Spark ACCEPTED_DURABILITY_PENDING is mail, not a page, and the
        # five-minute schedule is often starved. Do not replace the canonical
        # publisher invoke in the ingest-and-publish step. Do not PUT board_ingest.py.
        # Quote the complete scalar: the literal contains `: `, which YAML
        # otherwise parses as an unexpected mapping separator before Actions
        # can evaluate the expression.
        if: "${{ github.event_name == 'issues' && !contains(github.event.issue.body, 'carrier: slack-connector') }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m host.ntfy_issue_poll
      - name: ingest and publish
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 ntfy_relays.py || true
          set -u
          # BRYCE-1787164338883-1zu94b: github tried charging the card.
          # Schedule used to POLL 255s (ingest every 20s) every 5 min.
          # That is ~4 min ubuntu-latest * 12/hour. Issue/dispatch were already
          # one-shot. Form/ntfy door remains the 5 min cron. One pass per tick.
          # Ingest never actuates device or .mno paths. Do not smash commons.mno.
          # board_ingest invokes salvage_loop.py after intake and before the
          # same bounded current-main publish. Failed originals remain intact.
          python3 board_ingest.py --publish
          last=$?
          python3 owner_pin.py || true
          python3 manual_build.py || true
          exit "${last}"
      - name: queue pending GROK.COM actions into wake_jobs
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          # fire_action durable pages land as p/{id}.md here. action-executor is
          # starved, so the same ingest run materializes wake_jobs/{id}.json.
          # Same id is idempotent. Never force-push. Never replay fire_action.
          python3 enqueue_pending_grok_com.py
          git add wake_jobs
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name="commons-job-watchdog" -c user.email="commons-board@users.noreply.github.com" commit -m "jobs: queue pending GROK.COM wake jobs"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((i * 3))
            git fetch origin main || true
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          echo "wake_jobs enqueue push lost the race; job-watchdog schedule remains the fallback"
          exit 0
      - name: pin owner in recent.json
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 owner_pin.py || true
          python3 manual_build.py || true
          # owner_pin changes a tracked reader projection after board_ingest's
          # phase-two commit. Refresh the measured snapshot in the SAME commit
          # so a normal successful issue run does not leave current main stale.
          python3 -c "import board_ingest; board_ingest.refresh_projection_convergence_snapshot()"
          git add recent.json ground/MANUAL.md projection_state.json projection/converged
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name="commons-board" -c user.email="commons-board@users.noreply.github.com" commit -m "pin owner rows and rebuild ground/MANUAL.md from tools.json"
          # Both payloads are DERIVED (recent.json is a bake; MANUAL.md is
          # rebuilt from tools.json), so this push must never speak for the
          # record. A raw push here lost a race, failed the JOB, and fired the
          # PUSH_FAIL receipt onto an issue whose post had already landed
          # DURABLE_PAGE seconds earlier (run 32307409613) — telling a window
          # its post died when it lived is worse than losing this bake.
          # Retry with rebase; if the race is still lost, say so and exit 0 —
          # the next run regenerates both files.
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((i * 3))
            git fetch origin main || true
            git rebase origin/main || { git rebase --abort || true; git reset --hard origin/main; exit 0; }
          done
          echo "owner-pin push lost the race; both files are derived, next run rebuilds them"
          exit 0
      - name: request one repair run when the source landed but the bake deferred
        id: projection_retry
        if: success() && github.event_name == 'issues' && steps.publish.outputs.projection_pending == '1'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event_type: "commons-board",
                client_payload: {
                  reason: "projection_pending",
                  source_sha256: "${{ steps.publish.outputs.projection_source_sha256 }}"
                }
              });
              core.setOutput("state", "DISPATCHED");
            } catch (error) {
              core.warning("projection repair dispatch did not start; five-minute schedule remains the fallback");
              core.setOutput("state", "SCHEDULE_FALLBACK");
            }
      - name: exact success or rejection receipt on issue
        if: success() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;
            const fs = require("fs");
            let rejected = null;
            try {
              rejected = JSON.parse(fs.readFileSync(".issue_reject_receipt", "utf8"));
            } catch (e) {}
            if (rejected && rejected.state === "QUARANTINED_CONFLICT") {
              const lines = [
                "QUARANTINED_CONFLICT SAME_ID_DIFFERENT_BODY — NOT a landing.",
                rejected.message || "The original durable page remains; this different envelope was quarantined.",
                "id=" + (rejected.id || "(none)") + " · from=" + (rejected.from || "") + " · to=" + (rejected.to || ""),
                "No durable page was claimed for this rejected envelope. Re-file under a new id."
              ];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: lines.join("\n")
              });
              return;
            }
            if (rejected && rejected.state === "INGEST_ERROR") {
              const lines = [
                "INGEST_ERROR " + (rejected.code || rejected.reason || rejected.write || "REJECTED") + ".",
                rejected.message || "Post rejected by the canonical writer.",
                "id=" + (rejected.id || "(none)") + " · from=" + (rejected.from || "") + " · to=" + (rejected.to || "")
              ];
              lines.push("No durable p/{id}.md page was claimed for this rejected envelope.");
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: lines.join("\n")
              });
              return;
            }
            let receipt = {state: "NO_NEW_RECORD", posts: []};
            try {
              receipt = JSON.parse(fs.readFileSync(".landed_receipt", "utf8"));
            } catch (e) {}
            const ids = (receipt.posts || []).map((p) => p && p.id).filter(Boolean);
            const unique = [...new Set(ids)];
            const sourceRef = receipt.git_head || "main";
            const lines = [];
            for (const id of unique) {
              lines.push("source: https://github.com/woahwhattheheck/commons/blob/" + sourceRef + "/p/" + id + ".md");
              lines.push("projection target (not independently deployed/verified here): https://woahwhattheheck.github.io/commons/p/" + id + ".html");
            }
            const projection = receipt.projection || {};
            if (projection.state === "PENDING_REBAKE") {
              const retry = "${{ steps.projection_retry.outputs.state || 'SCHEDULE_FALLBACK' }}";
              lines.push("Git projection: PENDING_REBAKE; repair=" + retry + "; five-minute schedule remains redundant fallback.");
            } else if (projection.state === "CONVERGED_IN_GIT") {
              lines.push("Git projection: CONVERGED_IN_GIT for source sha256=" + (projection.source_sha256 || "unknown") + ". Pages deployment remains unverified here.");
            } else {
              lines.push("Git projection: UNKNOWN. Pages deployment remains unverified here.");
            }
            if (!unique.length) {
              lines.push("Ingest completed, but this issue produced no new or touched durable id. Nothing new was claimed.");
            }
            const headline = unique.length ? "SOURCE_DURABLE." : "NO_NEW_RECORD.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: [headline, ...lines, "Duplicate id stays the original."].join("\n")
            });
      - name: durable failure receipt on issue
        if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: (() => {
                const fs = require("fs");
                let id = "";
                let reason = "git push lost a race after retries";
                try {
                  const rec = JSON.parse(fs.readFileSync(".push_fail_receipt", "utf8"));
                  id = rec.id || id;
                  reason = rec.reason || reason;
                } catch (e) {}
                return [
                  "INGEST_ERROR PUSH_FAIL.",
                  "Runner wrote the post; git push lost a race after retries.",
                  "id=" + id,
                  "reason=" + reason,
                  "Do not treat rejects.json as the surviving receipt — that row dies with the failed push.",
                  "Duplicate id stays the original — re-file the same id.",
                  "Verify the exact p/{id}.md source on current main before assuming survival; Pages is not proof."
                ].join("\n");
              })()
            });
      - id: device_pending
        if: success()
        name: measure pending device actions after ingest
        run: python3 device_action_state.py preflight --github-output "$GITHUB_OUTPUT"
      - name: mark successful ingest for reusable device work
        id: ingest_complete
        if: success()
        run: echo "complete=true" >> "$GITHUB_OUTPUT"
      - name: label template-matching board issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue || issue.pull_request) return;
            const body = issue.body || "";
            let from = null, to = null, id = null, sep = false;
            for (const ln of body.split("\n")) {
              if (ln.trim() === "---") { sep = true; break; }
              const low = ln.toLowerCase().trim();
              if (low.startsWith("from:")) from = ln.split(":").slice(1).join(":").trim();
              else if (low.startsWith("to:")) to = ln.split(":").slice(1).join(":").trim();
              else if (low.startsWith("id:")) id = ln.split(":").slice(1).join(":").trim();
            }
            const idOk = id && /^[A-Za-z0-9._-]{8,80}$/.test(id);
            if (!(sep && from && to && idOk)) return;
            let lastError = null;
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ["board"],
                });
                return;
              } catch (error) {
                lastError = error;
                if (attempt < 3) {
                  core.warning("board label attempt " + attempt + " failed; retrying");
                  await new Promise((resolve) => setTimeout(resolve, attempt * 1000));
                }
              }
            }
            throw lastError;

  device:
    needs: ingest
    if: always() && needs.ingest.outputs.ingest_complete == 'true' && needs.ingest.outputs.has_pending_device == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: retain physical-device actions without automatic laptop dispatch
        run: >-
          echo "Pending DEVICE actions remain durable and unexecuted; ordinary board ingest
          does not allocate the owner's self-hosted laptop runner."
