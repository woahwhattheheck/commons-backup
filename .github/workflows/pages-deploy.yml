name: pages-deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  # GitHub-managed "pages build and deployment" (dynamic/pages/pages-build-deployment)
  # still Jekyll-publishes main on push even when Pages build_type=workflow.
  # That artifact is the git tree: no generated pages-deploy.json. A success
  # marks the Actions deploy-pages deployment inactive (MEASURED: run
  # 33586981030 success at 03:28:02Z, then run 33586937091 success at 03:30:05Z
  # left live pages-deploy.json 404 and head.json source=scheduled-pages-bake).
  # Re-publish the allowlisted _site after a successful Jekyll clobber only.
  # Do not hook cancelled Jekyll runs — ingest storms cancel those; a push
  # trigger was dropped for the same reason.
  workflow_run:
    workflows:
      - pages-build-deployment
      - pages build and deployment
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build allowlisted _site
        run: |
          set -euo pipefail
          mkdir -p _site
          # Keep: whole tree minus bulk muhl/ (except docs + free-sample SEED0),
          # excerpts/, conflicts/, .github/. chunks/ MUST stay (board.js).
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'excerpts/' \
            --exclude 'conflicts/' \
            --exclude 'muhl/' \
            --exclude '_site/' \
            ./ _site/
          mkdir -p _site/muhl/docs _site/muhl/containers/MUHLNICKEL_DISTRO
          if [ -d muhl/docs ]; then rsync -a muhl/docs/ _site/muhl/docs/; fi
          if [ -f muhl/containers/MUHLNICKEL_DISTRO/SEED0.mno ]; then
            cp -a muhl/containers/MUHLNICKEL_DISTRO/SEED0.mno \
              _site/muhl/containers/MUHLNICKEL_DISTRO/SEED0.mno
          fi
          python3 - <<'PY'
          import json, os
          sha = os.environ.get('GITHUB_SHA', '')
          run_id = os.environ.get('GITHUB_RUN_ID', '')
          attempt = os.environ.get('GITHUB_RUN_ATTEMPT', '')
          receipt = {
            'sha': sha,
            'run_id': run_id,
            'attempt': attempt,
            'excludes': ['.git/', '.github/', 'excerpts/', 'conflicts/', 'muhl/ (except muhl/docs/ and SEED0.mno)'],
            'keeps': ['chunks/', 'muhl/docs/', 'muhl/containers/MUHLNICKEL_DISTRO/SEED0.mno', 'pay.html', 'action.html', 'commerce.html'],
          }
          with open('_site/pages-deploy.json', 'w', encoding='utf-8') as f:
            json.dump(receipt, f, indent=2)
            f.write('\n')
          print(f"PAGES_DEPLOYED url=https://woahwhattheheck.github.io/commons/ sha={sha} run={run_id}")
          PY
          test -f _site/pages-deploy.json
          ls -la _site/pages-deploy.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
