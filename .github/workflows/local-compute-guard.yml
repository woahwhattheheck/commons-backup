name: local-compute-guard

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  # placement checks the tree at HEAD, never a diff, so a newer push to main
  # (or to the same PR head) supersedes a queued one.  Dispatch keeps run_id.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.label || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: keep automatic compute off the owner laptop
        run: python3 local_compute_guard.py
