<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="668" viewBox="0 0 820 668" role="img" aria-labelledby="cross-title cross-desc">
<title id="cross-title">Example Assessment (synthetic) - comparison across groups</title>
<desc id="cross-desc">SYNTHETIC EXAMPLE - fictional groups and fictional evidence. Not a University of Iowa finding. Comparison across groups. Each assessment area is a column; each rating is a horizontal lane, strongest at the top. Two further lanes sit below a dividing rule: insufficient evidence, and not assessed. Those two are not lower ratings - they are statements about the evidence this review holds. Software delivery - Established: ESS, IAM; Gap: RIS. Reliability and operations - Strength: ESS; Established: RIS; Insufficient evidence: IAM. Security practices - Established: IAM; Developing: ESS; Sources disagree: RIS. AI readiness - Insufficient evidence: RIS; Not assessed: ESS; Not applicable: IAM. Group context: ESS is central team, ~40 staff, shared platform; RIS is ~12 staff, grant-funded, bursty demand; IAM is ~9 staff, vendor-hosted core. Groups differ in size, funding and service model; read a difference as a prompt for a question, not as a ranking.</desc>
<defs><pattern id="cross-tex-ESTABLISHED" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="8" height="8" fill="#2F6A93"/><line x1="0" y1="4" x2="8" y2="4" stroke="#FFFFFF" stroke-width="1.4"/></pattern><pattern id="cross-tex-DEVELOPING" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="8" height="8" fill="#8F6510"/><circle cx="2" cy="2" r="1.4" fill="#FFFFFF"/><circle cx="6" cy="6" r="1.4" fill="#FFFFFF"/></pattern><pattern id="cross-tex-GAP" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="8" height="8" fill="#9C3016"/><path d="M0,8 L8,0" stroke="#FFFFFF" stroke-width="1.4"/><path d="M-2,2 L2,-2" stroke="#FFFFFF" stroke-width="1.4"/><path d="M6,10 L10,6" stroke="#FFFFFF" stroke-width="1.4"/></pattern><pattern id="cross-tex-INSUFFICIENT_EVIDENCE" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="8" height="8" fill="#D8D8D4"/><path d="M0,8 L8,0" stroke="#5E5E5A" stroke-width="1.26"/><path d="M0,0 L8,8" stroke="#5E5E5A" stroke-width="1.26"/></pattern><pattern id="cross-tex-UNASSESSED" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="8" height="8" fill="#EFEFEC"/><path d="M0,0 L8,8" stroke="#7A7A74" stroke-width="1.4"/></pattern><pattern id="cross-tex-NOT_APPLICABLE" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="8" height="8" fill="#E4E4DE"/><rect x="0" y="0" width="4" height="4" fill="#7A7A73"/><rect x="4" y="4" width="4" height="4" fill="#7A7A73"/></pattern><pattern id="cross-tex-CONTRADICTORY" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="8" height="8" fill="#EDE4D2"/><polygon points="0,8 8,0 8,4 4,8" fill="#6B4F16"/><polygon points="0,0 4,0 0,4" fill="#6B4F16"/></pattern></defs>
