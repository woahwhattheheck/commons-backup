<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="792" height="430" viewBox="0 0 792 430" role="img" aria-labelledby="roadmap-title roadmap-desc">
<title id="roadmap-title">Example Assessment (synthetic) - phased roadmap</title>
<desc id="roadmap-desc">SYNTHETIC EXAMPLE - fictional groups and fictional evidence. Not a University of Iowa finding. Phased roadmap in three planning horizons: phase 1 0-90 days, phase 2 90-180 days, phase 3 180+ days. Phase 1 (0-90 days): R1 Agree one approval record for production access changes, from REC-03; effort 2-3 weeks, 1 analyst. R2 Collect local availability records for the identity service, from REC-07; effort 1-2 weeks, 1 engineer. Phase 2 (90-180 days): R3 Extend dependency scanning to the legacy pipelines, from REC-03; effort 4-6 weeks, 2 engineers; after R1. R4 Document a shared delivery standard for project teams, from REC-11; effort not estimated; after R2. Phase 3 (180+ days): R5 Assess AI readiness for the groups deferred in this round, from REC-14; effort 6-8 weeks, 2 analysts; after R4. Phase windows are planning horizons, not commitments. Items with no effort estimate are marked as such and not scheduled by guesswork.</desc>
