<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="818" height="510" viewBox="0 0 818 510" role="img" aria-labelledby="evidence-title evidence-desc">
<title id="evidence-title">Example Assessment (synthetic) - evidence behind each group</title>
<desc id="evidence-desc">SYNTHETIC EXAMPLE - fictional groups and fictional evidence. Not a University of Iowa finding. Evidence behind each group, as a stacked bar of items collected by kind: documents reviewed, interviews, system records, observed artifacts. Enterprise Shared Services (ESS): 38 items - documents reviewed 10, interviews 9, system records 14, observed artifacts 5. 3 of 4 areas rated; 1 not assessed; counts incomplete for observed artifacts; 38 evidence items. Research Infrastructure Services (RIS): 24 items - documents reviewed 8, interviews 9, system records 7, observed artifacts not recorded. 2 of 4 areas rated; 1 with insufficient evidence; 1 where sources disagree; 24 evidence items. Identity and Access Management (IAM): 25 items - documents reviewed 8, interviews 7, system records 10, observed artifacts 0. 2 of 4 areas rated; 1 with insufficient evidence; 1 not applicable to this group; 25 evidence items. A longer bar means the area is better evidenced, not that the group performs better. A count of zero is a recorded measurement and is shown as a zero token; a kind nobody recorded is shown as not recorded and is never added to a total as if it were zero. Areas not assessed contribute no evidence.</desc>
<defs><pattern id="evidence-tex-ev-interviews" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="8" height="8" fill="#8F6510"/><circle cx="2" cy="2" r="1" fill="#FFFFFF"/><circle cx="6" cy="6" r="1" fill="#FFFFFF"/></pattern><pattern id="evidence-tex-ev-system_records" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="8" height="8" fill="#10505E"/><path d="M0,8 L8,0" stroke="#FFFFFF" stroke-width="1"/><path d="M-2,2 L2,-2" stroke="#FFFFFF" stroke-width="1"/><path d="M6,10 L10,6" stroke="#FFFFFF" stroke-width="1"/></pattern><pattern id="evidence-tex-ev-observed" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="8" height="8" fill="#1F6B4B"/><path d="M0,8 L8,0" stroke="#FFFFFF" stroke-width="0.9"/><path d="M0,0 L8,8" stroke="#FFFFFF" stroke-width="0.9"/></pattern></defs>
