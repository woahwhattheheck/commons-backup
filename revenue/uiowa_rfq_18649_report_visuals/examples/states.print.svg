<text x="24" y="56" font-size="12" fill="#4A4A45" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">SYNTHETIC REFERENCE FIXTURE - defines the visual vocabulary only. No University data appears in this figure. Colour is never the only difference between two rows.</text>
