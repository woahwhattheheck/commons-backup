<text x="724" y="457" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">excluded from totals; never summed as 0</text>
<line x1="24" y1="474" x2="974" y2="474" stroke="#6B6B66" stroke-width="1"/>
<text x="24" y="494" font-size="10.5" fill="#4A4A45" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Each row differs from every other in shape, texture, border style and wording, not only in colour. Open the .mono.svg copy to confirm: the colour is genuinely removed there, not simulated.</text>
<text x="24" y="510" font-size="10.5" fill="#4A4A45" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Solid border: a value we have. Dashed: a value we do not have. Double: more than one value, both kept. None of the unrated states is a low score.</text>
