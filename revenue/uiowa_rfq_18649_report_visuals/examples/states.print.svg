<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="998" height="588" viewBox="0 0 998 588" role="img" aria-labelledby="states-title states-desc">
<title id="states-title">Report visuals: every state, side by side</title>
<desc id="states-desc">SYNTHETIC REFERENCE FIXTURE - defines the visual vocabulary only. No University data appears in this figure. Every state the report can show, with what it means and how it is counted. No two states differ only by colour. Ratings, counted as ratings: Strength (mark ▲, solid fill, solid border); Established (mark ●, lines_horizontal fill, solid border); Developing (mark ◆, dots fill, solid border); Gap (mark ▼, diagonal_45 fill, solid border). Not ratings, each excluded from every rating count: Insufficient evidence (mark ◎, crosshatch fill, dashed border) - We looked in this area and what we received did not support any rating.; Not assessed (mark —, diagonal_135 fill, dashed border) - This area was outside the agreed scope for this group. It is not a rating.; Not applicable (mark ⊘, checker fill, dashed border) - This practice does not apply to how this group operates. Nothing is missing.; Sources disagree (mark ≠, split_diagonal fill, double border) - Two or more sources give different answers. Both readings are kept, unreconciled.. No record supplied: the input carried no row for this cell. Shown as an empty dashed outline, excluded from counts, and reported as a hole in the input. Values: measured zero is a real count of zero, shown with a solid border because it is a value we have, and counted as the value 0. Not recorded means no count was supplied, shown with a dashed border, excluded from totals and never summed as if it were zero. Border language: solid means a value we have, dashed means a value we do not have, double means more than one value with both kept. None of the unrated states is a low score.</desc>
<defs><pattern id="states-tex-ESTABLISHED" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="8" height="8" fill="#2F6A93"/><line x1="0" y1="4" x2="8" y2="4" stroke="#FFFFFF" stroke-width="1.4"/></pattern><pattern id="states-tex-DEVELOPING" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="8" height="8" fill="#8F6510"/><circle cx="2" cy="2" r="1.4" fill="#FFFFFF"/><circle cx="6" cy="6" r="1.4" fill="#FFFFFF"/></pattern><pattern id="states-tex-GAP" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="8" height="8" fill="#9C3016"/><path d="M0,8 L8,0" stroke="#FFFFFF" stroke-width="1.4"/><path d="M-2,2 L2,-2" stroke="#FFFFFF" stroke-width="1.4"/><path d="M6,10 L10,6" stroke="#FFFFFF" stroke-width="1.4"/></pattern><pattern id="states-tex-INSUFFICIENT_EVIDENCE" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="8" height="8" fill="#D8D8D4"/><path d="M0,8 L8,0" stroke="#5E5E5A" stroke-width="1.26"/><path d="M0,0 L8,8" stroke="#5E5E5A" stroke-width="1.26"/></pattern><pattern id="states-tex-UNASSESSED" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="8" height="8" fill="#EFEFEC"/><path d="M0,0 L8,8" stroke="#7A7A74" stroke-width="1.4"/></pattern><pattern id="states-tex-NOT_APPLICABLE" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="8" height="8" fill="#E4E4DE"/><rect x="0" y="0" width="4" height="4" fill="#7A7A73"/><rect x="4" y="4" width="4" height="4" fill="#7A7A73"/></pattern><pattern id="states-tex-CONTRADICTORY" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="8" height="8" fill="#EDE4D2"/><polygon points="0,8 8,0 8,4 4,8" fill="#6B4F16"/><polygon points="0,0 4,0 0,4" fill="#6B4F16"/></pattern></defs>
