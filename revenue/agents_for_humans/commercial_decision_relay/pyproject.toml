[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commercial-decision-relay"
version = "0.1.1"
description = "Evidence-bound Strands agent that surfaces only real commercial decisions to a human closer."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["strands-agents==1.55.1"]

[project.optional-dependencies]
openai = ["strands-agents[openai]==1.55.1"]
dev = ["pytest>=8"]

[project.scripts]
decision-relay = "decision_relay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
