name: paid-discovery-offer

on:
  pull_request:
    paths:
      - 'revenue/paid_discovery_offer/**'
      - '.github/workflows/paid-discovery-offer.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/paid_discovery_offer/**'
      - '.github/workflows/paid-discovery-offer.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile package
        run: python -m py_compile revenue/paid_discovery_offer/*.py
      - name: Focused tests
        run: python -m unittest revenue.paid_discovery_offer.test_offer revenue.paid_discovery_offer.test_hardening -v
      - name: Focused tests under optimization
        run: python -O -m unittest revenue.paid_discovery_offer.test_offer revenue.paid_discovery_offer.test_hardening -v
