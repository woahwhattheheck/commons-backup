name: Revenue targeting allocator

on:
  pull_request:
    paths:
      - "revenue/revenue_targeting_allocator/**"
      - ".github/workflows/revenue-targeting-allocator.yml"
  push:
    branches: [main]
    paths:
      - "revenue/revenue_targeting_allocator/**"
      - ".github/workflows/revenue-targeting-allocator.yml"

permissions:
  contents: read

jobs:
  allocator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax
        run: python -m py_compile revenue/revenue_targeting_allocator/*.py
      - name: Hostile suite
        run: python -m unittest revenue.revenue_targeting_allocator.test_allocator
      - name: Optimized hostile suite
        run: python -O -m unittest revenue.revenue_targeting_allocator.test_allocator
      - name: Synthetic compile and verify
        shell: bash
        run: |
          out="$(mktemp -d)/priority"
          python -m revenue.revenue_targeting_allocator.cli compile revenue/revenue_targeting_allocator/synthetic_portfolio.json --output-dir "$out"
          python -m revenue.revenue_targeting_allocator.cli verify revenue/revenue_targeting_allocator/synthetic_portfolio.json --output-dir "$out"
