name: titan-v3-executable-sell-custody-sol-pro

on:
  pull_request:
    paths:
      - '.github/workflows/titan-v3-executable-sell-custody-sol-pro.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/executable-sell-custody-sol-pro/**'
      - 'p/sol-pro-titan-v3-executable-sell-custody-20260910-01.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  executable-sell-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "$EXPECTED_HEAD" | tee "$RUNNER_TEMP/head.sha"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact official-interpreter dependency
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7'

      - name: Compile and run focused custody contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=revenue/kaggriculture/cloud-execution-lab/candidates/executable-sell-custody-sol-pro
          python -m py_compile \
            "$ROOT/candidate.py" \
            "$ROOT/carrier.py" \
            "$ROOT/executable_receipt_profile.py" \
            "$ROOT/executable_sell_custody.py" \
            "$ROOT/route_census.py" \
            "$ROOT/carrier_smoke.py" \
            "$ROOT/test_executable_sell_custody.py"
          cd "$ROOT"
          PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 \
            python -m unittest -v test_executable_sell_custody.py

      - name: Census exact represented inactive suffixes
        shell: bash
        run: |
          set -euo pipefail
          ROOT=revenue/kaggriculture/cloud-execution-lab/candidates/executable-sell-custody-sol-pro
          PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 \
            python "$ROOT/route_census.py" --json "$RUNNER_TEMP/ROUTE-CENSUS.json"

      - name: Prove private carrier and first actions
        shell: bash
        run: |
          set -euo pipefail
          ROOT=revenue/kaggriculture/cloud-execution-lab/candidates/executable-sell-custody-sol-pro
          PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 \
            python "$ROOT/carrier_smoke.py" --json "$RUNNER_TEMP/CARRIER-SMOKE.json"

      - name: Verify canonical release remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          cd revenue/kaggriculture/cloud-execution-lab
          python build_integrated.py --check
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"

      - name: Retain exact custody receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v3-executable-sell-custody-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/head.sha
            ${{ runner.temp }}/ROUTE-CENSUS.json
            ${{ runner.temp }}/CARRIER-SMOKE.json
          if-no-files-found: error
          retention-days: 30
