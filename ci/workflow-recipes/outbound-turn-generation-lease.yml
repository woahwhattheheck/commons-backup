name: outbound-turn-generation-lease

on:
  push:
    paths:
      - 'tools/outbound_send_guard/turn_generation_lease.py'
      - 'tools/outbound_send_guard/test_turn_generation_lease.py'
      - 'tools/outbound_send_guard/TURN_GENERATION_LEASE.md'
      - '.github/workflows/outbound-turn-generation-lease.yml'
  pull_request:
    paths:
      - 'tools/outbound_send_guard/turn_generation_lease.py'
      - 'tools/outbound_send_guard/test_turn_generation_lease.py'
      - 'tools/outbound_send_guard/TURN_GENERATION_LEASE.md'
      - '.github/workflows/outbound-turn-generation-lease.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile tools/outbound_send_guard/turn_generation_lease.py tools/outbound_send_guard/test_turn_generation_lease.py
      - name: Unit tests
        run: python -m unittest -v tools.outbound_send_guard.test_turn_generation_lease
      - name: Unit tests optimized
        run: python -O -m unittest -v tools.outbound_send_guard.test_turn_generation_lease
