name: NIH SPARK PubMed baseline

on:
  pull_request:
    paths:
      - 'research/nih_spark_pubmed_2026/**'
      - '.github/workflows/nih-spark-pubmed.yml'
  push:
    paths:
      - 'research/nih_spark_pubmed_2026/**'
      - '.github/workflows/nih-spark-pubmed.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax
        run: python -m py_compile research/nih_spark_pubmed_2026/*.py
      - name: Tests
        run: python -m unittest research.nih_spark_pubmed_2026.test_baseline research.nih_spark_pubmed_2026.test_retrieval_authority -v
      - name: Optimized tests
        run: python -O -m unittest research.nih_spark_pubmed_2026.test_baseline research.nih_spark_pubmed_2026.test_retrieval_authority -v
