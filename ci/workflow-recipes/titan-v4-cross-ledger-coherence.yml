name: TITAN V4 cross-ledger coherence

on:
  pull_request:
    paths:
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v4/CANONICAL.json'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v4/INTEGRATION.json'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v4/COMPOSITION.json'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v4/check_composition_graph.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/**'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v4/research/**'
      - '.github/workflows/titan-v4-cross-ledger-coherence.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v4/CANONICAL.json'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v4/INTEGRATION.json'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v4/COMPOSITION.json'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v4/check_composition_graph.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/**'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v4/research/**'
      - '.github/workflows/titan-v4-cross-ledger-coherence.yml'

permissions:
  contents: read

jobs:
  coherence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate canonical control-plane JSON
        run: |
          python -B -m json.tool revenue/kaggriculture/cloud-execution-lab/candidates/v4/CANONICAL.json >/dev/null
          python -B -m json.tool revenue/kaggriculture/cloud-execution-lab/candidates/v4/INTEGRATION.json >/dev/null
          python -B -m json.tool revenue/kaggriculture/cloud-execution-lab/candidates/v4/COMPOSITION.json >/dev/null
      - name: Validate composition graph
        run: >-
          python -B revenue/kaggriculture/cloud-execution-lab/candidates/v4/check_composition_graph.py --json
      - name: Validate cross-ledger coherence
        run: >-
          python -B revenue/kaggriculture/cloud-execution-lab/candidates/v4/research/cross-ledger-coherence/check_cross_ledger.py --pretty
      - name: Run composition graph regressions
        run: >-
          python -B revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/tooling/composition-graph/test_composition_graph.py
      - name: Re-run composition graph regressions under optimized Python
        run: >-
          python -O -B revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/tooling/composition-graph/test_composition_graph.py
      - name: Run cross-ledger regressions
        run: >-
          python -B revenue/kaggriculture/cloud-execution-lab/candidates/v4/research/cross-ledger-coherence/test_check_cross_ledger.py
      - name: Re-run cross-ledger regressions under optimized Python
        run: >-
          python -O -B revenue/kaggriculture/cloud-execution-lab/candidates/v4/research/cross-ledger-coherence/test_check_cross_ledger.py
