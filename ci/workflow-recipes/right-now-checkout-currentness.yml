name: Right-now checkout currentness

on:
  pull_request:
    paths:
      - "host/right_now_revenue.py"
      - "host/right_now_revenue_core.py"
      - "revenue/right_now/stripe_checkout_current.json"
      - "revenue/right_now/CHECKOUT_CURRENTNESS.md"
      - "test_right_now_checkout_authority.py"
      - "test_right_now_checkout_currentness.py"
      - "test_right_now_checkout_cardinality.py"
      - ".github/workflows/right-now-checkout-currentness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-currentness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile exact carrier
        run: |
          python -m py_compile \
            host/right_now_revenue.py \
            host/right_now_revenue_core.py \
            test_right_now_checkout_authority.py \
            test_right_now_checkout_currentness.py \
            test_right_now_checkout_cardinality.py
      - name: Currentness hostiles
        run: |
          python -m unittest -v \
            test_right_now_checkout_authority.py \
            test_right_now_checkout_currentness.py \
            test_right_now_checkout_cardinality.py
      - name: Currentness hostiles under optimized mode
        run: |
          python -O -m unittest -v \
            test_right_now_checkout_authority.py \
            test_right_now_checkout_currentness.py \
            test_right_now_checkout_cardinality.py
