name: uiowa-068-recovery-evidence

on:
  pull_request:
    paths:
      - 'revenue/uiowa_rfq_18649_recovery_evidence/**'
      - '.github/workflows/uiowa-068-recovery-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/uiowa_rfq_18649_recovery_evidence/**'
      - '.github/workflows/uiowa-068-recovery-evidence.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile revenue/uiowa_rfq_18649_recovery_evidence/assess_recovery.py revenue/uiowa_rfq_18649_recovery_evidence/test_assess_recovery.py
      - name: Unit tests
        working-directory: revenue/uiowa_rfq_18649_recovery_evidence
        run: python -m unittest -v test_assess_recovery.py
      - name: Reproduce synthetic outputs
        working-directory: revenue/uiowa_rfq_18649_recovery_evidence
        run: |
          python assess_recovery.py fixtures/synthetic_recovery_records.json \
            --json-output /tmp/uiowa-068-report.json \
            --csv-output /tmp/uiowa-068-matrix.csv \
            --markdown-output /tmp/uiowa-068-scenario.md
          grep -q 'DEMONSTRATED' /tmp/uiowa-068-matrix.csv
          grep -q 'Successful backup evidence does not demonstrate restoration' /tmp/uiowa-068-scenario.md
