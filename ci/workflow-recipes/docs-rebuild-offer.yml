name: docs-rebuild-offer
on:
  pull_request:
    paths:
      - 'revenue/services/docs-rebuild-repair/**'
      - 'host/package_docs_rebuild_offer.py'
      - 'test_docs_rebuild_offer.py'
      - '.github/workflows/docs-rebuild-offer.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/services/docs-rebuild-repair/**'
      - 'host/package_docs_rebuild_offer.py'
      - 'test_docs_rebuild_offer.py'
      - '.github/workflows/docs-rebuild-offer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest -v test_docs_rebuild_offer
      - run: python3 host/package_docs_rebuild_offer.py --output "$RUNNER_TEMP/docs-rebuild-repair.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: docs-rebuild-repair
          path: ${{ runner.temp }}/docs-rebuild-repair.zip
          if-no-files-found: error
