name: titan-w10-realized-fertilizer

on:
  pull_request:
    paths:
      - "revenue/kaggriculture/cloud-execution-lab/analysis/w10-fertilizer-cycle/**"
      - ".github/workflows/titan-w10-realized-fertilizer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titan-w10-realized-fertilizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certificate:
    name: strict paired-trace certificate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Select Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile checker and tests
        run: |
          python -m py_compile \
            revenue/kaggriculture/cloud-execution-lab/analysis/w10-fertilizer-cycle/realized_fertilizer.py \
            revenue/kaggriculture/cloud-execution-lab/analysis/w10-fertilizer-cycle/test_realized_fertilizer.py
      - name: Run fail-closed matrix
        run: |
          python -m unittest -v \
            revenue/kaggriculture/cloud-execution-lab/analysis/w10-fertilizer-cycle/test_realized_fertilizer.py
