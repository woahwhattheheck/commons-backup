name: titan-v3-state-conditioned-safe-own-sol-pareto

on:
  push:
    paths:
      - '.github/workflows/titan-v3-state-conditioned-safe-own-sol-pareto.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-state-conditioned-safe-own-sol-pareto/**'
  pull_request:
    paths:
      - '.github/workflows/titan-v3-state-conditioned-safe-own-sol-pareto.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-state-conditioned-safe-own-sol-pareto/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-package-action-bound-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      EXPECTED_PARENT_HEAD: 'b6b9a8a4ca26152bbfe1a3833380ca885e5c4cae'
      SEEDS: '1499566513,847364567,670735128,384678039,229763129,456866617,280210384,1415408371'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 20
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned official-interpreter dependency
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7'

      - name: Run exact archive-bound safe-own paired screen
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          CASE=revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-state-conditioned-safe-own-sol-pareto
          OUT="$RUNNER_TEMP/titan-v3-state-conditioned-safe-own"
          bash "$CASE/run_bound_panel.sh" "$OUT" 2>&1 \
            | tee "$RUNNER_TEMP/titan-v3-state-conditioned-safe-own.log"

      - name: Retain complete and partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v3-state-conditioned-safe-own-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/titan-v3-state-conditioned-safe-own/
            ${{ runner.temp }}/titan-v3-state-conditioned-safe-own.log
          if-no-files-found: error
          retention-days: 30

      - name: Require terminal action-bound evidence
        if: always()
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/titan-v3-state-conditioned-safe-own"
          test -s "$RUNNER_TEMP/titan-v3-state-conditioned-safe-own.log"
          test -s "$OUT/COMPLETE"
          test -s "$OUT/ACTION-ADMISSION.json"
          test -s "$OUT/PROVENANCE.json"
          python - "$OUT/PROVENANCE.json" "$EXPECTED_HEAD" <<'PY'
          import json
          from pathlib import Path
          import sys
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["git_head"] == sys.argv[2]
          assert report["stacked_parent"] == "b6b9a8a4ca26152bbfe1a3833380ca885e5c4cae"
          assert report["planned_games_total"] == 64
          assert report["canonical_release_modified"] is False
          assert report["promotion_authorized"] is False
          assert report["provider_action_authorized"] is False
          print(json.dumps({"admission_verdict": report["admission_verdict"],
                            "overall": report["overall"]}, sort_keys=True))
          PY
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
