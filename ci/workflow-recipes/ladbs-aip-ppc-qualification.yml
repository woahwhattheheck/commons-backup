name: LADBS AIP-PPC qualification

on:
  pull_request:
    paths:
      - 'pursuits/ladbs_aip_ppc_222114/**'
      - 'tests/test_ladbs_aip_ppc_qualification.py'
      - '.github/workflows/ladbs-aip-ppc-qualification.yml'
      - 'tools/proposal_gate/proposal_gate.py'
  push:
    branches: [main]
    paths:
      - 'pursuits/ladbs_aip_ppc_222114/**'
      - 'tests/test_ladbs_aip_ppc_qualification.py'
      - '.github/workflows/ladbs-aip-ppc-qualification.yml'
      - 'tools/proposal_gate/proposal_gate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pack invariants
        run: python -m unittest -v tests/test_ladbs_aip_ppc_qualification.py
      - name: Proposal gate must remain fail-closed
        shell: bash
        run: |
          set +e
          python tools/proposal_gate/proposal_gate.py \
            pursuits/ladbs_aip_ppc_222114/requirements.json \
            pursuits/ladbs_aip_ppc_222114/evidence.json \
            --check
          rc=$?
          set -e
          test "$rc" -eq 2
