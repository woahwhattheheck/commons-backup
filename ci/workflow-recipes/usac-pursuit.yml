name: USAC pursuit gate

on:
  pull_request:
    paths:
      - 'opportunities/usac_it_26_139_ai_consulting/**'
      - 'revenue/pursuit_evidence_bridge/**'
      - 'revenue/bidder_qualification_vault/**'
      - '.github/workflows/usac-pursuit.yml'
  push:
    branches: [main]
    paths:
      - 'opportunities/usac_it_26_139_ai_consulting/**'
      - 'revenue/pursuit_evidence_bridge/**'
      - 'revenue/bidder_qualification_vault/**'
      - '.github/workflows/usac-pursuit.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: >-
          python -m py_compile
          opportunities/usac_it_26_139_ai_consulting/qualify.py
          opportunities/usac_it_26_139_ai_consulting/test_qualify.py
          revenue/pursuit_evidence_bridge/*.py
          revenue/bidder_qualification_vault/*.py
      - name: Contract tests
        run: python -m unittest -v opportunities.usac_it_26_139_ai_consulting.test_qualify
      - name: Optimized contract tests
        run: python -O -m unittest -v opportunities.usac_it_26_139_ai_consulting.test_qualify
      - name: Current gate must remain held for this source generation
        shell: bash
        run: |
          set +e
          python -m opportunities.usac_it_26_139_ai_consulting.qualify > /tmp/usac-current.json
          code=$?
          set -e
          test "$code" -eq 2
          python - <<'PY'
          import json
          result = json.load(open("/tmp/usac-current.json", encoding="utf-8"))
          assert result["status"] == "HOLD"
          assert result["external_submission_authorized"] is False
          expected = {
              "BID_SHEET_BYTES_NOT_RETAINED",
              "CONFIDENTIALITY_AGREEMENT_BYTES_NOT_RETAINED",
              "CURRENT_BUYER_PAGE_GENERATION_NOT_RETAINED",
              "Q_AND_A_BYTES_NOT_RETAINED",
              "RFP_BYTES_NOT_RETAINED",
              "VAULT_ROOTS_NOT_PINNED",
          }
          assert expected.issubset(set(result["reason_codes"]))
          assert result["authority"] and not any(result["authority"].values())
          PY
