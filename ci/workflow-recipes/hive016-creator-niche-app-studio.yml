name: hive016-creator-niche-app-studio
on:
  pull_request:
    paths:
      - 'revenue/hive_creator_niche_app_studio/**'
      - '.github/workflows/hive016-creator-niche-app-studio.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile revenue/hive_creator_niche_app_studio/studio.py revenue/hive_creator_niche_app_studio/app.py revenue/hive_creator_niche_app_studio/test_studio.py revenue/hive_creator_niche_app_studio/test_app.py
      - name: Focused tests
        working-directory: revenue/hive_creator_niche_app_studio
        run: |
          python -m unittest -v test_studio.py test_app.py
          python -O -m unittest -v test_studio.py test_app.py
