name: Commercial Decision Relay hardening

on:
  pull_request:
    paths:
      - "revenue/agents_for_humans/commercial_decision_relay/**"
      - ".github/workflows/commercial-decision-relay-hardening.yml"

permissions:
  contents: read

jobs:
  exact-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact package + dev dependencies
        run: python -m pip install -e 'revenue/agents_for_humans/commercial_decision_relay[dev]'
      - name: Assert exact Strands SDK pin
        run: python -c 'import importlib.metadata as m; assert m.version("strands-agents") == "1.55.1", m.version("strands-agents")'
      - name: Compile
        run: python -m py_compile revenue/agents_for_humans/commercial_decision_relay/src/decision_relay/*.py revenue/agents_for_humans/commercial_decision_relay/tests/*.py
      - name: Unit tests
        working-directory: revenue/agents_for_humans/commercial_decision_relay
        run: python -m unittest discover -s tests -v
      - name: Optimized unit tests
        working-directory: revenue/agents_for_humans/commercial_decision_relay
        run: python -O -m unittest discover -s tests -v
      - name: Pytest
        working-directory: revenue/agents_for_humans/commercial_decision_relay
        run: pytest -q
