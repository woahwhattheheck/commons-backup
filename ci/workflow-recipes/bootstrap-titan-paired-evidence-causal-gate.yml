name: Bootstrap TITAN paired-evidence causal gate

on:
  push:
    branches:
      - "sol-auditor/titan-v3-paired-evidence-causal-gate-20260910-01"
    paths:
      - ".titan-guard-bootstrap/**"
      - ".github/workflows/bootstrap-titan-paired-evidence-causal-gate.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "sol-auditor/titan-v3-paired-evidence-causal-gate-20260910-01"
          fetch-depth: 0
      - name: Safely materialize the claimed additive packet
        shell: bash
        run: |
          set -euo pipefail
          cat .titan-guard-bootstrap/part* > "$RUNNER_TEMP/bundle.b85"
          python - "$RUNNER_TEMP/bundle.b85" <<'PY'
          import base64
          import gzip
          import io
          import pathlib
          import sys
          import tarfile

          root = pathlib.Path.cwd().resolve()
          payload = base64.b85decode(pathlib.Path(sys.argv[1]).read_bytes())
          data = gzip.decompress(payload)
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:") as archive:
              members = archive.getmembers()
              for member in members:
                  target = (root / member.name).resolve()
                  if root not in target.parents or not member.isfile():
                      raise SystemExit(f"unsafe bundle member: {member.name!r}")
              for member in members:
                  target = root / member.name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f"missing payload: {member.name!r}")
                  target.write_bytes(source.read())
          PY
          rm -rf .titan-guard-bootstrap
          rm -f .github/workflows/bootstrap-titan-paired-evidence-causal-gate.yml

      - name: Validate before publishing generated bytes
        shell: bash
        env:
          PACKET: revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-paired-evidence-causal-gate-sol-auditor
        run: |
          set -euo pipefail
          python "$PACKET/source_contract.py"
          python -m py_compile "$PACKET"/*.py
          (cd "$PACKET" && python -m unittest -v)
          python "$PACKET/paired_evidence_guard.py" \
            "$PACKET/valid-upside.json" --output "$RUNNER_TEMP/valid.json" \
            --require-verdict UPSIDE_SCREEN
          set +e
          python "$PACKET/paired_evidence_guard.py" \
            "$PACKET/mixed-cell-laundering.json" --output "$RUNNER_TEMP/invalid.json"
          status=$?
          set -e
          [[ "$status" -eq 2 ]]

      - name: Commit only the validated final packet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TITAN: add paired-evidence causal gate"
          git push origin HEAD:sol-auditor/titan-v3-paired-evidence-causal-gate-20260910-01
