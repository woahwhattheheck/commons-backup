name: Gloo FlourishRelay

on:
  pull_request:
    paths:
      - 'competitions/gloo2026_flourish_relay/**'
      - '.github/workflows/gloo-flourish-relay.yml'
  push:
    branches: [main]
    paths:
      - 'competitions/gloo2026_flourish_relay/**'
      - '.github/workflows/gloo-flourish-relay.yml'

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile competitions/gloo2026_flourish_relay/flourish_relay.py competitions/gloo2026_flourish_relay/provider_adapter.py competitions/gloo2026_flourish_relay/pack.py
      - name: Tests
        run: python -m unittest discover -s competitions/gloo2026_flourish_relay/tests -v
      - name: Optimized tests
        run: python -O -m unittest discover -s competitions/gloo2026_flourish_relay/tests -v
      - name: Deterministic package proof
        run: |
          python competitions/gloo2026_flourish_relay/pack.py build competitions/gloo2026_flourish_relay /tmp/one.zip
          python competitions/gloo2026_flourish_relay/pack.py build competitions/gloo2026_flourish_relay /tmp/two.zip
          cmp /tmp/one.zip /tmp/two.zip
          python competitions/gloo2026_flourish_relay/pack.py verify /tmp/one.zip
