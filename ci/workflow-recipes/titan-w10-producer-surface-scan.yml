name: titan-w10-producer-surface-scan

on:
  pull_request:
    paths:
      - "revenue/kaggriculture/cloud-execution-lab/**"
      - ".github/workflows/titan-w10-producer-surface-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titan-w10-producer-surface-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  W10_DIR: revenue/kaggriculture/cloud-execution-lab/analysis/w10-fertilizer-cycle
  V4_DIR: revenue/kaggriculture/cloud-execution-lab/candidates/v4

jobs:
  scan:
    name: content-addressed producer seam inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve expected exact-head SHA
        id: expected
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            expected="${{ github.event.pull_request.head.sha }}"
          else
            expected="${{ github.sha }}"
          fi
          test -n "$expected"
          echo "sha=$expected" >> "$GITHUB_OUTPUT"

      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.expected.outputs.sha }}
          fetch-depth: 1

      - name: Fail closed unless workspace HEAD matches expected SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.expected.outputs.sha }}"
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "HEAD $actual does not equal expected exact-head $expected" >&2
            exit 1
          fi
          echo "Verified exact-head checkout: $actual"

      - name: Select Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove changed default-OFF V4 activation seams
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ steps.expected.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            "$V4_DIR/check_activation_contracts.py" \
            "$V4_DIR/test_check_activation_contracts.py"
          python -B "$V4_DIR/test_check_activation_contracts.py"
          PYTHONOPTIMIZE=1 python -B "$V4_DIR/test_check_activation_contracts.py"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --diff-filter=ACMRT --name-only "$BASE_SHA" "$HEAD_SHA" -- "$V4_DIR" \
            | python -B "$V4_DIR/check_activation_contracts.py" \
                --root "$GITHUB_WORKSPACE" \
                --paths-from-stdin

      - name: Prove the scanner contract
        run: |
          python -m py_compile \
            "$W10_DIR/producer_surface_scan.py" \
            "$W10_DIR/test_producer_surface_scan.py"
          python -m unittest -v \
            "$W10_DIR/test_producer_surface_scan.py"

      - name: Scan the live cloud-execution source tree
        run: |
          python "$W10_DIR/producer_surface_scan.py" \
            --root "$GITHUB_WORKSPACE" \
            --scope revenue/kaggriculture/cloud-execution-lab \
            --output /tmp/titan-w10-producer-surface.json \
            --pretty \
            --allow-empty

      - name: Bind verified checkout SHA into the JSON evidence
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.expected.outputs.sha }}"
          python - "$expected" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected = sys.argv[1]
          path = Path("/tmp/titan-w10-producer-surface.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          if report.get("checkout_sha") not in (None, expected):
              raise SystemExit(
                  f"checkout_sha already bound to {report.get('checkout_sha')!r}"
              )
          report["checkout_sha"] = expected
          # Recompute result_sha256 over the body that now includes checkout_sha.
          body = {k: v for k, v in report.items() if k != "result_sha256"}
          payload = json.dumps(
              body, sort_keys=True, separators=(",", ":"), ensure_ascii=True
          )
          import hashlib
          report["result_sha256"] = hashlib.sha256(payload.encode("utf-8")).hexdigest()
          path.write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Bound checkout_sha={expected} result_sha256={report['result_sha256']}")
          PY

      - name: Publish ranked candidates to the job summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path('/tmp/titan-w10-producer-surface.json').read_text(encoding='utf-8')
          )
          lines = [
              '# TITAN W10 producer-surface inventory',
              '',
              f"- Decision: **{report['decision']}**",
              f"- Checkout SHA: `{report.get('checkout_sha', 'unset')}`",
              f"- Scanned Python files: {report['counts']['scanned_python_files']}",
              f"- Candidate files: {report['counts']['candidate_files']}",
              f"- Report SHA-256: `{report['result_sha256']}`",
              '',
              '| Rank | Score | Full cycle | Path | Phases | Source SHA-256 |',
              '|---:|---:|:---:|---|---|---|',
          ]
          for rank, candidate in enumerate(report['candidates'][:20], start=1):
              phases = ', '.join(candidate['phases'])
              full_cycle = 'yes' if candidate['full_cycle_candidate'] else 'no'
              lines.append(
                  f"| {rank} | {candidate['score']} | {full_cycle} | "
                  f"`{candidate['path']}` | {phases} | `{candidate['sha256']}` |"
              )
          if not report['candidates']:
              lines.append('| — | — | — | No lexical producer surface found | — | — |')
          lines.extend(
              [
                  '',
                  '> Lexical/AST rank is a navigation aid, not runtime proof or mutation authority.',
              ]
          )
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write('\n'.join(lines) + '\n')
          PY

      - name: Upload the exact JSON inventory
        uses: actions/upload-artifact@v4
        with:
          name: titan-w10-producer-surface-${{ steps.expected.outputs.sha }}
          path: /tmp/titan-w10-producer-surface.json
          if-no-files-found: error
          retention-days: 14
