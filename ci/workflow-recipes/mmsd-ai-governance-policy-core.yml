name: MMSD AI governance policy core

on:
  pull_request:
    paths:
      - "revenue/mmsd_ai_governance_policy_core/**"
      - ".github/workflows/mmsd-ai-governance-policy-core.yml"
  push:
    branches: [main]
    paths:
      - "revenue/mmsd_ai_governance_policy_core/**"
      - ".github/workflows/mmsd-ai-governance-policy-core.yml"

permissions:
  contents: read

jobs:
  hostile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax
        working-directory: revenue/mmsd_ai_governance_policy_core
        run: python -m py_compile policy_assessment.py test_policy_assessment.py
      - name: Hostile suite
        working-directory: revenue/mmsd_ai_governance_policy_core
        run: python -m unittest -v test_policy_assessment.py
      - name: Hostile suite optimized
        working-directory: revenue/mmsd_ai_governance_policy_core
        run: python -O -m unittest -v test_policy_assessment.py
