name: SCDHHS MCDE 5400030026 qualification

on:
  pull_request:
    paths:
      - "revenue/scdhhs_mcde_5400030026/**"
      - ".github/workflows/scdhhs-mcde-5400030026.yml"
  push:
    branches: [main]
    paths:
      - "revenue/scdhhs_mcde_5400030026/**"
      - ".github/workflows/scdhhs-mcde-5400030026.yml"

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        optimize: ["normal", "optimized"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m py_compile revenue/scdhhs_mcde_5400030026/qualification.py
      - name: Run focused hostile suite
        env:
          PYTHONOPTIMIZE: ${{ matrix.optimize == 'optimized' && '1' || '0' }}
        run: python -m unittest -v revenue.scdhhs_mcde_5400030026.test_qualification
