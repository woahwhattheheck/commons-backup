name: DOE GEMS solver CI

on:
  pull_request:
    paths:
      - 'competitions/doe_gems/**'
      - '.github/workflows/doe-gems-ci.yml'
  push:
    branches: [main]
    paths:
      - 'competitions/doe_gems/**'
      - '.github/workflows/doe-gems-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: competitions/doe_gems/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r competitions/doe_gems/requirements.txt
      - run: python -m unittest -v competitions/doe_gems/test_gems_solver.py
      - run: python -O -m unittest -v competitions/doe_gems/test_gems_solver.py
      - run: python -m py_compile competitions/doe_gems/gems_solver.py competitions/doe_gems/test_gems_solver.py competitions/doe_gems/synthetic_smoke.py
      - run: python -m competitions.doe_gems.synthetic_smoke
