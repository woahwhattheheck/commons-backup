name: TTUHSC pursuit gate

on:
  pull_request:
    paths:
      - 'opportunities/ttuhsc_739_sl3821039_enterprise_ai/**'
      - 'revenue/pursuit_evidence_bridge/**'
      - 'revenue/bidder_qualification_vault/**'
      - '.github/workflows/ttuhsc-pursuit.yml'
  push:
    branches: [main]
    paths:
      - 'opportunities/ttuhsc_739_sl3821039_enterprise_ai/**'
      - 'revenue/pursuit_evidence_bridge/**'
      - 'revenue/bidder_qualification_vault/**'
      - '.github/workflows/ttuhsc-pursuit.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: >-
          python -m py_compile
          opportunities/ttuhsc_739_sl3821039_enterprise_ai/qualify.py
          opportunities/ttuhsc_739_sl3821039_enterprise_ai/test_qualify.py
          revenue/pursuit_evidence_bridge/*.py
          revenue/bidder_qualification_vault/*.py
      - name: Contract tests
        run: python -m unittest -v opportunities.ttuhsc_739_sl3821039_enterprise_ai.test_qualify
      - name: Optimized contract tests
        run: python -O -m unittest -v opportunities.ttuhsc_739_sl3821039_enterprise_ai.test_qualify
      - name: Current gate must remain held for this source generation
        shell: bash
        run: |
          set +e
          python -m opportunities.ttuhsc_739_sl3821039_enterprise_ai.qualify > /tmp/ttuhsc-current.json
          code=$?
          set -e
          test "$code" -eq 2
          python - <<'PY'
          import json
          result = json.load(open("/tmp/ttuhsc-current.json", encoding="utf-8"))
          assert result["status"] == "HOLD"
          assert result["external_submission_authorized"] is False
          assert "FIRST_PARTY_PACKET_BYTES_NOT_RETAINED" in result["reason_codes"]
          assert "BUYER_ADDENDA_GENERATION_NOT_RETAINED" in result["reason_codes"]
          assert "VAULT_ROOTS_NOT_PINNED" in result["reason_codes"]
          assert result["authority"] and not any(result["authority"].values())
          PY
