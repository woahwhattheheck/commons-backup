name: titan-v5-b9-h3c-current-abi

on:
  pull_request:
    paths:
      - ".github/workflows/titan-v5-b9-h3c-current-abi.yml"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v5/research/b9-h3c-current-abi/**"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/b9_terminal_fertilizer.py"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/h3c_goose_eod_cap_rescue.py"

permissions:
  contents: read

concurrency:
  group: titan-v5-b9-h3c-current-abi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Assert exact triggering head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile and run outer-wrapper contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v5/research/b9-h3c-current-abi
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -B -m py_compile outer_wrappers_current.py staged_runtime.py test_outer_wrappers_current.py test_staged_runtime.py
          python -B -m unittest -v test_outer_wrappers_current.py test_staged_runtime.py
          python -O -B -m unittest -v test_outer_wrappers_current.py test_staged_runtime.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain)"
