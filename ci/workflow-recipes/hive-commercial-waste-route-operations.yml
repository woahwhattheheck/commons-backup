name: hive-commercial-waste-route-operations

on:
  pull_request:
    paths:
      - "revenue/hive/commercial-waste-route-operations/**"
      - ".github/workflows/hive-commercial-waste-route-operations.yml"
  push:
    branches: [main]
    paths:
      - "revenue/hive/commercial-waste-route-operations/**"
      - ".github/workflows/hive-commercial-waste-route-operations.yml"

permissions:
  contents: read

jobs:
  stdlib-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and hostile tests
        run: python revenue/hive/commercial-waste-route-operations/test_desk.py
      - name: Synthetic walkthrough
        run: python revenue/hive/commercial-waste-route-operations/demo.py
      - name: Compile
        run: python -m compileall -q revenue/hive/commercial-waste-route-operations
