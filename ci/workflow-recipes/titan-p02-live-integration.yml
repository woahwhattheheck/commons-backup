name: titan-p02-live-integration

on:
  pull_request:
    paths:
      - '.github/workflows/titan-p02-live-integration.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/land_unlock_*'
      - 'revenue/kaggriculture/cloud-execution-lab/p02_candidate*.py'
      - 'revenue/kaggriculture/cloud-execution-lab/summarize_p02_panel.py'
      - 'revenue/kaggriculture/cloud-execution-lab/run_p02_live_panel.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_land_unlock_*'
      - 'revenue/kaggriculture/cloud-execution-lab/test_p02_isolated_source_path.py'
      - 'revenue/kaggriculture/cloud-execution-lab/P02-LIVE-INTEGRATION.md'

permissions:
  contents: read

concurrency:
  group: titan-p02-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Assert exact triggering head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run certificate plus live-adapter contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -m py_compile land_unlock_timing.py land_unlock_timing_test_support.py \
            land_unlock_runtime.py land_unlock_runtime_support.py land_unlock_runtime_strict.py p02_candidate.py p02_candidate_base.py p02_candidate_strict.py \
            summarize_p02_panel.py run_p02_live_panel.py test_land_unlock_timing.py \
            test_land_unlock_timing_engine.py test_land_unlock_runtime.py test_land_unlock_public_identity.py \
            test_land_unlock_runtime_integration.py test_land_unlock_runtime_strict.py \
            test_p02_isolated_source_path.py
          python -m unittest -v test_land_unlock_timing test_land_unlock_timing_engine \
            test_land_unlock_runtime test_land_unlock_public_identity test_land_unlock_runtime_integration test_land_unlock_runtime_strict \
            test_p02_isolated_source_path
          python build_integrated.py --check
          test -z "$(git status --porcelain)"

  official-panel:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Assert exact triggering head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned engine
        run: python -m pip install --quiet 'kaggle-environments==1.32.7'
      - name: Run exact candidate versus unchanged current in both seats
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python revenue/kaggriculture/cloud-execution-lab/run_p02_live_panel.py \
            --workspace "$GITHUB_WORKSPACE" \
            --work "$RUNNER_TEMP/p02-artifact" \
            --head "${{ github.event.pull_request.head.sha }}"
          test -s "$RUNNER_TEMP/p02-artifact/dev/SUMMARY.json"
          test -s "$RUNNER_TEMP/p02-artifact/holdout/SUMMARY.json"
          test -s "$RUNNER_TEMP/p02-artifact/MANIFEST.json"
          test -s "$RUNNER_TEMP/p02-artifact/RESULTS.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-p02-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p02-artifact/
          if-no-files-found: error
          retention-days: 30
