name: vesuvius-ct-ridge-snap

on:
  pull_request:
    paths:
      - 'research/vesuvius-ct-ridge-snap/**'
      - '.github/workflows/vesuvius-ct-ridge-snap.yml'
  push:
    paths:
      - 'research/vesuvius-ct-ridge-snap/**'
      - '.github/workflows/vesuvius-ct-ridge-snap.yml'

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'numpy>=2.0,<3'
      - working-directory: research/vesuvius-ct-ridge-snap
        run: |
          python -m py_compile core.py run.py tests/test_core.py tests/test_cli.py
          python -m unittest discover -s tests -v
          python -O -m unittest discover -s tests -v
