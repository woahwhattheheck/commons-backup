name: SD13365 partner readiness

on:
  pull_request:
    paths:
      - "revenue/sd13365_partner_readiness/**"
      - ".github/workflows/sd13365-partner-readiness.yml"
  push:
    branches: [main]
    paths:
      - "revenue/sd13365_partner_readiness/**"
      - ".github/workflows/sd13365-partner-readiness.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Materialize bounded source matrix
        working-directory: revenue/sd13365_partner_readiness
        run: python assemble_requirements.py
      - name: Compile
        run: >-
          python -m py_compile
          revenue/sd13365_partner_readiness/matrix.py
          revenue/sd13365_partner_readiness/matrix_core.py
          revenue/sd13365_partner_readiness/safe_output.py
          revenue/sd13365_partner_readiness/assemble_requirements.py
          revenue/sd13365_partner_readiness/test_matrix.py
          revenue/sd13365_partner_readiness/test_assembly.py
          revenue/sd13365_partner_readiness/test_source_binding.py
          revenue/sd13365_partner_readiness/test_output_custody.py
      - name: Normal tests
        working-directory: revenue/sd13365_partner_readiness
        run: python -m unittest discover -s . -p 'test*.py' -v
      - name: Optimized tests
        working-directory: revenue/sd13365_partner_readiness
        run: python -O -m unittest discover -s . -p 'test*.py' -v
      - name: Deterministic receipt smoke test
        working-directory: revenue/sd13365_partner_readiness
        run: |
          python matrix.py requirements.json --output receipt-a.json > /tmp/receipt-a.stdout
          python matrix.py requirements.json --output receipt-b.json > /tmp/receipt-b.stdout
          cmp receipt-a.json receipt-b.json
          cmp /tmp/receipt-a.stdout /tmp/receipt-b.stdout
