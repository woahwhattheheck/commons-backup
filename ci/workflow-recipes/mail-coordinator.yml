name: Mail coordinator

on:
  pull_request:
    paths:
      - 'services/mail-coordinator/**'
      - '.github/workflows/mail-coordinator.yml'
  push:
    branches: [main]
    paths:
      - 'services/mail-coordinator/**'
      - '.github/workflows/mail-coordinator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/mail-coordinator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q mail_coordinator tests
      - name: Contracts
        run: python -m unittest discover -s tests -v
