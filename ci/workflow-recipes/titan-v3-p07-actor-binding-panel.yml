name: TITAN V3 P07 actor-binding panel

on:
  push:
    branches:
      - sol-pro/titan-v3-p07-actor-binding-panel-20260910-01
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-current-cardinality-and-score:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind exact head and stacked scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ROOT=revenue/kaggriculture/cloud-execution-lab/candidates/v3
          git diff --name-only HEAD^ HEAD | tee "$RUNNER_TEMP/changed.txt"
          while IFS= read -r path; do
            case "$path" in
              "$ROOT/p07_actor_binding_panel.py"|\
              "$ROOT/test_p07_actor_binding_panel.py"|\
              "$ROOT/README-P07-PANEL.md"|\
              .github/workflows/titan-v3-p07-actor-binding-panel.yml) ;;
              *) echo "out-of-scope path: $path" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/changed.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/head.sha"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned official interpreter dependency
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7'

      - name: Run panel and inherited P07 contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=revenue/kaggriculture/cloud-execution-lab/candidates/v3
          cd "$ROOT"
          PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 \
            python -m unittest -v test_p07_actor_binding_panel.py \
              overlay/checks/test_p07_joint_actor_assignment.py \
              overlay/checks/test_p07_materialize.py
          python -m py_compile p07_actor_binding_panel.py p07_materialize.py \
            overlay/p07_joint_actor_assignment.py
          git -C ../../../../../ diff --exit-code

      - name: Run exact replay-seed and independent both-seat panel
        shell: bash
        run: |
          set -euo pipefail
          ROOT=revenue/kaggriculture/cloud-execution-lab/candidates/v3
          mkdir -p "$RUNNER_TEMP/p07-panel"
          set +e
          python "$ROOT/p07_actor_binding_panel.py" \
            --head "$(git rev-parse HEAD)" \
            --seeds '539131249,2611092301,2611092303' \
            --opponents 'arlene,v1' \
            --workers 2 \
            --action-timeout 1.0 \
            --startup-timeout 15 \
            --game-timeout 180 \
            --output "$RUNNER_TEMP/p07-panel/PANEL.json" \
            --markdown "$RUNNER_TEMP/p07-panel/PANEL.md"
          rc=$?
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 3 ]]; then
            echo "P07 panel failed structurally with exit $rc" >&2
            exit "$rc"
          fi
          printf '%s\n' "$rc" > "$RUNNER_TEMP/p07-panel/VERDICT-EXIT.txt"

      - name: Validate structural receipt and publish summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/p07-panel/PANEL.md" ]]; then
            cat "$RUNNER_TEMP/p07-panel/PANEL.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# P07 panel produced no Markdown report' >> "$GITHUB_STEP_SUMMARY"
          fi
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p07-panel'
          report = json.loads((root / 'PANEL.json').read_text())
          assert report['status'] == 'complete', report
          summary = report['summary']
          assert summary['cells'] == 12, summary
          assert report['baseline_gate']['valid'] and report['candidate_gate']['valid']
          assert all(row['candidate_action_count'] == 719 for row in report['cells'])
          assert not any(row['actor_cardinality_regressed'] for row in report['cells'])
          print(json.dumps({
              'decision': report['verdict']['decision'],
              'baseline_overages': summary['baseline_total_hand_overage_commands'],
              'candidate_overages': summary['candidate_total_hand_overage_commands'],
              'mean_own_delta': summary['mean_own_delta'],
              'mean_margin_delta': summary['mean_margin_delta'],
          }, sort_keys=True))
          PY

      - name: Retain exact source, action, actor, and score evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v3-p07-actor-binding-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/head.sha
            ${{ runner.temp }}/changed.txt
            ${{ runner.temp }}/p07-panel/
          if-no-files-found: error
          retention-days: 30
