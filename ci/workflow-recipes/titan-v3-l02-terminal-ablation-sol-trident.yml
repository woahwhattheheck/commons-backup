name: titan-v3-l02-terminal-ablation-sol-trident

on:
  push:
    paths:
      - '.github/workflows/titan-v3-l02-terminal-ablation-sol-trident.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3-l02-terminal-ablation-sol-trident/**'
  pull_request:
    paths:
      - '.github/workflows/titan-v3-l02-terminal-ablation-sol-trident.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3-l02-terminal-ablation-sol-trident/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contracts-and-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf '%s\n' "$EXPECTED_HEAD" | tee "$RUNNER_TEMP/ablation-head.sha"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact interpreter dependency
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7'

      - name: Pure ablation contracts
        shell: bash
        run: |
          set -euo pipefail
          cd revenue/kaggriculture/cloud-execution-lab/candidates/v3-l02-terminal-ablation-sol-trident
          PYTHONDONTWRITEBYTECODE=1 python -m unittest -v test_ablation.py test_rank_arms.py
          python -m py_compile *.py

      - name: Verify canonical release remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          cd revenue/kaggriculture/cloud-execution-lab
          python build_integrated.py --check
          git diff --exit-code -- .

      - name: Build pinned Apex opponent once
        shell: bash
        run: |
          set -euo pipefail
          APEX=revenue/kaggriculture/cloud-policy-portfolio/vendor/apex
          g++ -O3 -std=c++17 -shared -fPIC -I"$APEX/source/include" -o "$APEX/agent.so" \
            "$APEX/source/policy.cpp" "$APEX/submission_bridge.cpp"
          sha256sum "$APEX/agent.so" | tee "$RUNNER_TEMP/apex-agent.sha256"

      - name: Run five-arm official-engine screen
        shell: bash
        run: |
          set -euo pipefail
          ROOT=revenue/kaggriculture/cloud-execution-lab/candidates/v3-l02-terminal-ablation-sol-trident
          mkdir -p "$RUNNER_TEMP/l02-ablation"
          for arm in once_all day28_all once_carrot once_wheat once_noncarrot; do
            set +e
            python "$ROOT/run_arm.py" \
              --arm "$arm" \
              --head "$(git rev-parse HEAD)" \
              --seeds '2611092201,2611092207' \
              --opponents 'arlene,apex,kaito_v43,public_bt12,v1' \
              --workers 4 \
              --action-timeout 1.0 \
              --startup-timeout 15 \
              --game-timeout 180 \
              --output "$RUNNER_TEMP/l02-ablation/${arm}.json" \
              --markdown "$RUNNER_TEMP/l02-ablation/${arm}.md"
            rc=$?
            set -e
            if [[ "$rc" -ne 0 && "$rc" -ne 3 ]]; then
              echo "arm $arm failed structurally with exit $rc" >&2
              exit "$rc"
            fi
          done
          python "$ROOT/rank_arms.py" \
            "$RUNNER_TEMP"/l02-ablation/once_all.json \
            "$RUNNER_TEMP"/l02-ablation/day28_all.json \
            "$RUNNER_TEMP"/l02-ablation/once_carrot.json \
            "$RUNNER_TEMP"/l02-ablation/once_wheat.json \
            "$RUNNER_TEMP"/l02-ablation/once_noncarrot.json \
            --output "$RUNNER_TEMP/l02-ablation/RANKING.json" \
            --markdown "$RUNNER_TEMP/l02-ablation/RANKING.md"

      - name: Publish screen summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/l02-ablation/RANKING.md" ]]; then
            cat "$RUNNER_TEMP/l02-ablation/RANKING.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# L02 ablation screen did not produce a ranking' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain exact screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v3-l02-terminal-ablation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ablation-head.sha
            ${{ runner.temp }}/apex-agent.sha256
            ${{ runner.temp }}/l02-ablation/
          if-no-files-found: error
          retention-days: 30
