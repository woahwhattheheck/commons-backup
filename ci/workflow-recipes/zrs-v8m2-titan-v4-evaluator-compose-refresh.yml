name: ZRS V8M2 TITAN evaluator composition refresh

on:
  push:
    branches:
      - zrs-v8m2/titan-v4-evaluator-child-mode-compose
    paths:
      - .github/workflows/zrs-v8m2-titan-v4-evaluator-compose-refresh.yml

permissions:
  contents: write

concurrency:
  group: zrs-v8m2-titan-v4-evaluator-compose-refresh
  cancel-in-progress: false

jobs:
  refresh-authority-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OLD_EVALUATOR_BLOB: 1fb6b655bb4ca1e1684be165a8ef513e2e6c2325
      NEW_EVALUATOR_BLOB: 6d9edcc4ec5eeee22c8a6faec6ddd208a9a2e9e7
      LAB: revenue/kaggriculture/cloud-execution-lab
      GATE: revenue/kaggriculture/cloud-execution-lab/candidates/v5/champion-ratchet/champion_gate.py
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zrs-v8m2/titan-v4-evaluator-child-mode-compose
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify exact evaluator generation and rotate live authority pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$LAB/reference/evaluator/evaluate.py")" = "$NEW_EVALUATOR_BLOB"
          python -B - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['GATE'])
          old = os.environ['OLD_EVALUATOR_BLOB']
          new = os.environ['NEW_EVALUATOR_BLOB']
          text = path.read_text(encoding='utf-8')
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one live evaluator pin, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Advance deterministic canonical package and preserve predecessor archive
        working-directory: revenue/kaggriculture/cloud-execution-lab
        shell: bash
        run: |
          set -euo pipefail
          python -B build_integrated.py | tee "$RUNNER_TEMP/new-current-receipt.json"
          python -B build_integrated.py --check | tee "$RUNNER_TEMP/verified-current-receipt.json"
          python -B - <<'PY'
          import hashlib, os, tarfile
          from pathlib import Path
          archive = Path('exports/titan-current.tar.gz')
          with tarfile.open(archive, 'r:gz') as tf:
              data = tf.extractfile('checks/reference/evaluator/evaluate.py').read()
          blob = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          expected = os.environ['NEW_EVALUATOR_BLOB']
          if blob != expected:
              raise SystemExit(f'archive evaluator blob mismatch: {blob} != {expected}')
          print(f'canonical archive evaluator blob: {blob}')
          PY
      - name: Re-authenticate V5 champion authority against the new evaluator generation
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v5/champion-ratchet
        shell: bash
        run: |
          set -euo pipefail
          python -B -m py_compile champion_gate.py test_champion_gate.py
          python -B -m unittest -v test_champion_gate
          python -O -B -m unittest -v test_champion_gate
          python -B - <<'PY'
          from pathlib import Path
          import champion_gate as gate
          kg = Path('../../../..').resolve(strict=True)
          receipt = gate.authenticate_repo(kg)
          assert receipt['repo']['cloud-execution-lab/reference/evaluator/evaluate.py']['git_blob'] == gate.REQUIRED_EVALUATOR_GIT_BLOB
          print('live champion authority: PASS', gate.REQUIRED_EVALUATOR_GIT_BLOB)
          PY
      - name: Commit generated authority chain to the composition branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Z-RutheniumSwitchyard-0247-V8M2"
          git config user.email "tokenjunkielabs@gmail.com"
          git add -- "$GATE" \
            "$LAB/exports/titan-current.tar.gz" \
            "$LAB/exports/historical" \
            "$LAB/runtime/integrated-selected/CURRENT-SOURCE.json" \
            "$LAB/runtime/integrated-selected/CURRENT-ARCHIVE.json"
          if git diff --cached --quiet; then
            echo "No authority-chain changes to commit"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "TITAN V4: advance evaluator authority chain"
          git push origin HEAD:zrs-v8m2/titan-v4-evaluator-child-mode-compose
