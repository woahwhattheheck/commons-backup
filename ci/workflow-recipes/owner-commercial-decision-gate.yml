name: Owner commercial decision gate

on:
  push:
    paths:
      - 'tools/outbound_send_guard/owner_decision_gate.py'
      - 'tools/outbound_send_guard/test_owner_decision_gate.py'
      - 'tools/outbound_send_guard/OWNER_DECISION_GATE.md'
      - 'tools/outbound_send_guard/example-owner-decision-request.json'
      - 'tools/outbound_send_guard/example-owner-decision-provider-snapshot.json'
      - 'tools/outbound_send_guard/example-owner-decision-ledger.json'
      - '.github/workflows/owner-commercial-decision-gate.yml'
  pull_request:
    paths:
      - 'tools/outbound_send_guard/owner_decision_gate.py'
      - 'tools/outbound_send_guard/test_owner_decision_gate.py'
      - 'tools/outbound_send_guard/OWNER_DECISION_GATE.md'
      - 'tools/outbound_send_guard/example-owner-decision-request.json'
      - 'tools/outbound_send_guard/example-owner-decision-provider-snapshot.json'
      - 'tools/outbound_send_guard/example-owner-decision-ledger.json'
      - '.github/workflows/owner-commercial-decision-gate.yml'

permissions:
  contents: read

jobs:
  hostile-gate:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: |
          python -m py_compile \
            tools/outbound_send_guard/owner_decision_gate.py \
            tools/outbound_send_guard/test_owner_decision_gate.py
      - name: Normal semantics
        run: python -m unittest -v tools.outbound_send_guard.test_owner_decision_gate
      - name: Optimized semantics
        run: python -O -m unittest -v tools.outbound_send_guard.test_owner_decision_gate