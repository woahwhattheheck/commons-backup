name: Port data QC current-time gate

on:
  pull_request:
    paths:
      - "revenue/port_data_qc_gate/**"
      - ".github/workflows/port-data-qc-gate.yml"
  push:
    branches: [main]
    paths:
      - "revenue/port_data_qc_gate/**"
      - ".github/workflows/port-data-qc-gate.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile revenue/port_data_qc_gate/gate.py revenue/port_data_qc_gate/_legacy_engine.py revenue/port_data_qc_gate/test_gate.py revenue/port_data_qc_gate/test_legacy_boundary.py revenue/port_data_qc_gate/test_temporal_equivalence.py
      - name: Unit tests
        run: python -m unittest discover -s revenue/port_data_qc_gate -p 'test*.py' -v
      - name: Optimized unit tests
        run: python -O -m unittest discover -s revenue/port_data_qc_gate -p 'test*.py' -v
