name: payment-capability

on:
  push:
    branches:
      - main
    paths: &paths
      - '.github/workflows/payment-capability.yml'
      - 'test_payment_capability.py'
      - 'test_payment_capability_door_hub.py'
      - 'test_payment_capability_hub_pages.py'
      - 'test_payment_capability_compose.py'
      - 'door.js'
      - 'index.html'
      - 'boards.html'
      - 'hub_pages.py'
      - 'host/listing_registry.py'
      - 'ground/RESOURCE_LEDGER.json'
      - 'ground/PROFITABILITY_BUILD_MAP.md'
      - 'ground/FEATURES.md'
      - 'ground/COMMERCE.md'
      - 'host/payment_capability.py'
      - 'payment-capability.html'
      - 'payment-capability.js'
      - 'pay.html'
      - 'pay.js'
      - 'tips.html'
      - 'commerce.html'
      - 'ground/PAYMENT_CAPABILITY.md'
      - 'ground/CHECKOUT_CAPABILITY.md'
      - 'ground/PAY.md'
      - 'ground/STRIPE.md'
      - 'revenue/payment_capability/**'
      - 'revenue/checkout_capability/**'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: payment-capability contracts
        run: python -W error -m unittest -q test_payment_capability.py test_payment_capability_door_hub.py test_payment_capability_hub_pages.py test_payment_capability_compose.py test_checkout_capability.py
      - name: syntax and JSON checks
        run: |
          python -m py_compile host/payment_capability.py host/listing_registry.py test_payment_capability.py test_payment_capability_door_hub.py test_payment_capability_hub_pages.py test_payment_capability_compose.py
          python -c "import json,pathlib; json.loads(pathlib.Path('revenue/payment_capability/registry.json').read_text(encoding='utf-8'))"
      - name: open-door anti-regression
        run: git show --format= --no-ext-diff HEAD | python open_door_guard.py --diff-file -
      - name: whitespace guard
        run: git diff --check HEAD^
