name: titan-v3-pressure-capital-sol-fuse

on:
  push:
    paths:
      - '.github/workflows/titan-v3-pressure-capital-sol-fuse.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-pressure-capital-solvency-sol-fuse/**'
      - 'p/TITAN-V3-PRESSURE-CAPITAL-SOLVENCY-20260910-01.md'
  pull_request:
    paths:
      - '.github/workflows/titan-v3-pressure-capital-sol-fuse.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-pressure-capital-solvency-sol-fuse/**'
      - 'p/TITAN-V3-PRESSURE-CAPITAL-SOLVENCY-20260910-01.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contracts-and-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind exact additive checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_HEAD: 2e2e7e52fd2d5c62117ac49c7f1eabb505078ffb
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$BASE_HEAD"
          git diff --name-only "$BASE_HEAD" HEAD | tee "$RUNNER_TEMP/pressure-capital-changed-paths.txt"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/titan-v3-pressure-capital-sol-fuse.yml) ;;
              revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-pressure-capital-solvency-sol-fuse/*) ;;
              p/TITAN-V3-PRESSURE-CAPITAL-SOLVENCY-20260910-01.md) ;;
              *) echo "out-of-scope path: $path" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/pressure-capital-changed-paths.txt"
          printf '%s\n' "$EXPECTED_HEAD" | tee "$RUNNER_TEMP/pressure-capital-head.sha"
          printf '%s\n' "$BASE_HEAD" | tee "$RUNNER_TEMP/pressure-capital-base.sha"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact interpreter dependency
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7'

      - name: Run source, predecessor, and composition contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-pressure-capital-solvency-sol-fuse
          PYTHONDONTWRITEBYTECODE=1 python -B "$ROOT/test_pressure_capital_solvent.py" -v \
            |& tee "$RUNNER_TEMP/pressure-capital-guard-tests.log"
          PYTHONDONTWRITEBYTECODE=1 python -B "$ROOT/test_candidate.py" -v \
            |& tee "$RUNNER_TEMP/pressure-capital-candidate-tests.log"
          python - "$ROOT" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          for path in sorted(root.glob("*.py")):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY

      - name: Verify current canonical release and additive nonmutation
        shell: bash
        run: |
          set -euo pipefail
          cd revenue/kaggriculture/cloud-execution-lab
          PYTHONDONTWRITEBYTECODE=1 python -B build_integrated.py --check
          git diff --exit-code -- .
          git status --porcelain --untracked-files=all | tee "$RUNNER_TEMP/pressure-capital-prepanel-status.txt"
          test ! -s "$RUNNER_TEMP/pressure-capital-prepanel-status.txt"

      - name: Run 192-game paired official-engine panel
        shell: bash
        run: |
          set -euo pipefail
          ROOT=revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-pressure-capital-solvency-sol-fuse
          mkdir -p "$RUNNER_TEMP/pressure-capital-panel"
          set +e
          PYTHONDONTWRITEBYTECODE=1 python -B "$ROOT/run_panel.py" \
            --head "$(git rev-parse HEAD)" \
            --seeds '2611092201,2611092202,2611092203,2611092204,2611092205,2611092206,2611092207,2611092208' \
            --opponents 'arlene,apex,kaito_v43,cok_v10,public_bt12,v1' \
            --workers 4 \
            --action-timeout 1.0 \
            --startup-timeout 15 \
            --game-timeout 180 \
            --output "$RUNNER_TEMP/pressure-capital-panel/PRESSURE-CAPITAL-PANEL.json" \
            --markdown "$RUNNER_TEMP/pressure-capital-panel/PRESSURE-CAPITAL-PANEL.md" \
            |& tee "$RUNNER_TEMP/pressure-capital-panel/PRESSURE-CAPITAL-PANEL.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/pressure-capital-panel/exit-code.txt"
          if [[ "$rc" -ne 0 && "$rc" -ne 3 ]]; then
            echo "pressure/capital panel failed structurally with exit $rc" >&2
            exit "$rc"
          fi

      - name: Prove checkout remained byte-clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all | tee "$RUNNER_TEMP/pressure-capital-final-status.txt"
          test ! -s "$RUNNER_TEMP/pressure-capital-final-status.txt"

      - name: Publish panel summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/pressure-capital-panel/PRESSURE-CAPITAL-PANEL.md" ]]; then
            cat "$RUNNER_TEMP/pressure-capital-panel/PRESSURE-CAPITAL-PANEL.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# Pressure/capital panel did not produce a summary' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v3-pressure-capital-sol-fuse-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pressure-capital-head.sha
            ${{ runner.temp }}/pressure-capital-base.sha
            ${{ runner.temp }}/pressure-capital-changed-paths.txt
            ${{ runner.temp }}/pressure-capital-guard-tests.log
            ${{ runner.temp }}/pressure-capital-candidate-tests.log
            ${{ runner.temp }}/pressure-capital-prepanel-status.txt
            ${{ runner.temp }}/pressure-capital-final-status.txt
            ${{ runner.temp }}/pressure-capital-panel/PRESSURE-CAPITAL-PANEL.json
            ${{ runner.temp }}/pressure-capital-panel/PRESSURE-CAPITAL-PANEL.md
            ${{ runner.temp }}/pressure-capital-panel/PRESSURE-CAPITAL-PANEL.log
            ${{ runner.temp }}/pressure-capital-panel/exit-code.txt
          if-no-files-found: warn
          retention-days: 30
