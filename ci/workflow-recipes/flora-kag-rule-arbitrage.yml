name: Kaggriculture rule-arbitrage receipt

on:
  pull_request:
    paths:
      - "revenue/kaggriculture/cloud-rule-arbitrage/**"
      - "test_flora_kag_rule_arbitrage_workflow_queue.py"
      - ".github/workflows/flora-kag-rule-arbitrage.yml"
  push:
    branches: [main]
    paths:
      - "revenue/kaggriculture/cloud-rule-arbitrage/**"
      - "test_flora_kag_rule_arbitrage_workflow_queue.py"
      - ".github/workflows/flora-kag-rule-arbitrage.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Exact event-head guard
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - name: Exact engine contracts and immutable result receipt
        run: |
          python -B revenue/kaggriculture/cloud-rule-arbitrage/test_rule_arbitrage.py
          python -B revenue/kaggriculture/cloud-rule-arbitrage/verify.py
          python -B test_flora_kag_rule_arbitrage_workflow_queue.py
          python -m compileall -q revenue/kaggriculture/cloud-rule-arbitrage
      - name: Diff and current-main guard
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --quiet --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          else
            MAIN_REFSPEC='+refs/heads/main:refs/remotes/origin/main'
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --quiet --filter=blob:none --unshallow origin "$MAIN_REFSPEC"
            else
              git fetch --quiet --filter=blob:none origin "$MAIN_REFSPEC"
            fi
            python .github/scripts/audit_git_terminal.py --target-ref origin/main --expected-commit "$EXPECTED_COMMIT" --required-path revenue/kaggriculture/cloud-rule-arbitrage/candidate.py
          fi
