name: Steerability public foundation

on:
  push:
    paths:
      - 'competitions/steerability-challenge-2026/**'
      - '.github/workflows/steerability-foundation.yml'
  pull_request:
    paths:
      - 'competitions/steerability-challenge-2026/**'
      - '.github/workflows/steerability-foundation.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile competitions/steerability-challenge-2026/*.py
      - name: Unit tests
        run: python -m unittest discover -s competitions/steerability-challenge-2026/tests -v
      - name: Optimized-mode unit tests
        run: python -O -m unittest discover -s competitions/steerability-challenge-2026/tests -v
      - name: Example selection and receipt verification
        run: |
          python competitions/steerability-challenge-2026/steerability_foundation.py select competitions/steerability-challenge-2026/fixtures/measurements.selection.json /tmp/selection.json
          python competitions/steerability-challenge-2026/steerability_foundation.py verify /tmp/selection.json
          python competitions/steerability-challenge-2026/submission_contract.py competitions/steerability-challenge-2026/fixtures/submission-plan.example.json >/tmp/plan-receipt.json
