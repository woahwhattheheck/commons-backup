name: Mapping Equity aggregation authority

on:
  pull_request:
    paths:
      - 'revenue/bias-bounty-mapping-equity/aggregation/**'
      - '.github/workflows/mapping-equity-aggregation-authority.yml'
  push:
    branches:
      - main
    paths:
      - 'revenue/bias-bounty-mapping-equity/aggregation/**'
      - '.github/workflows/mapping-equity-aggregation-authority.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    defaults:
      run:
        working-directory: revenue/bias-bounty-mapping-equity/aggregation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile exact authority surface
        run: >-
          python -m py_compile
          aggregate.py
          _aggregate_unsealed.py
          _zsa_d6p2_core.py
          test_aggregate.py
          test_recovery.py
          test_memfd_seal.py
          test_redirect_provenance.py
          test_execution_authority.py
      - name: Contract suite
        run: >-
          python -m unittest -v
          test_aggregate.py
          test_recovery.py
          test_memfd_seal.py
          test_redirect_provenance.py
          test_execution_authority.py
      - name: Optimized contract suite
        run: >-
          python -O -m unittest -v
          test_aggregate.py
          test_recovery.py
          test_memfd_seal.py
          test_redirect_provenance.py
          test_execution_authority.py
      - name: Deterministic plan smoke
        run: python aggregate.py plan --region northern-ca --sql > /tmp/northern-ca.plan.json
