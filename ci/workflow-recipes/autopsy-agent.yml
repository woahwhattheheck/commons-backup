name: autopsy-agent
on:
  pull_request:
    paths:
      - 'revenue/agents_for_humans/**'
      - '.github/workflows/autopsy-agent.yml'
      - '.github/scripts/audit_git_terminal.py'
  push:
    branches: [main]
    paths:
      - 'revenue/agents_for_humans/**'
      - '.github/workflows/autopsy-agent.yml'
      - '.github/scripts/audit_git_terminal.py'
jobs:
  windows-contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: revenue/agents_for_humans
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          # This Windows-only job does not consume Kaggriculture working-tree
          # files. Keep those case-colliding SOURCE.json/source.json pairs out
          # of the worktree while retaining the complete Git tree for ls-tree
          # and ancestry checks below.
          sparse-checkout: |
            .github
            revenue/agents_for_humans
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install audited dependencies in an isolated environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe scripts/install_audited.py
      - name: Check dependencies
        run: .\.venv\Scripts\python.exe -m pip check
      - name: Verify contracts with controlled models
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Verify attributed source bytes
        run: .\.venv\Scripts\python.exe scripts/verify_vendor.py
      - name: Verify clean landed state on current main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: >-
          python .github/scripts/audit_git_terminal.py --fetch
          --expected-commit "${{ github.sha }}"
          --required-path revenue/agents_for_humans/autopsy_agent/pipeline.py
          --required-path revenue/agents_for_humans/README.md
