name: titan-entrypoint-deadline

on:
  pull_request:
    paths:
      - '.github/workflows/titan-entrypoint-deadline.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/main.py'
      - 'revenue/kaggriculture/cloud-execution-lab/titan_runtime.py'
      - 'revenue/kaggriculture/cloud-execution-lab/terminal_history_join.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_entrypoint_deadline.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_entrypoint_clock.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_entrypoint_route_capsule.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_entrypoint_route_capsule_continuity.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_entrypoint_route_capsule_inner_deadline.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_final_market_pressure_entrypoint.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_history_observation_atomic.py'
      - 'revenue/kaggriculture/cloud-execution-lab/build_integrated.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_release_consistency.py'
      - 'revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz'
      - 'revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-*.json'
  workflow_dispatch:

concurrency:
  group: titan-entrypoint-deadline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deadline-containment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact triggering head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Source-tree deadline and composition contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            main.py \
            test_entrypoint_deadline.py \
            test_entrypoint_clock.py \
            test_entrypoint_route_capsule.py \
            test_entrypoint_route_capsule_continuity.py \
            test_entrypoint_route_capsule_inner_deadline.py \
            test_final_market_pressure_entrypoint.py \
            test_history_observation_atomic.py
          python3 -B -m unittest -v \
            test_entrypoint_deadline \
            test_entrypoint_clock \
            test_entrypoint_route_capsule \
            test_entrypoint_route_capsule_continuity \
            test_entrypoint_route_capsule_inner_deadline \
            test_final_market_pressure_entrypoint \
            test_history_observation_atomic
          python3 -O -B -m unittest -v \
            test_entrypoint_deadline \
            test_entrypoint_clock \
            test_entrypoint_route_capsule \
            test_entrypoint_route_capsule_continuity \
            test_entrypoint_route_capsule_inner_deadline \
            test_final_market_pressure_entrypoint \
            test_history_observation_atomic
      - name: Immutable package matches source
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-execution-lab/build_integrated.py --check
      - name: Packed deadline and composition contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          runtime="$(mktemp -d)"
          tar -xzf exports/titan-current.tar.gz -C "$runtime"
          (
            cd "$runtime"
            # EntryClock imports fixture helpers whose separate source suites
            # need research-only files; select the packed clock class explicitly.
            PYTHONPATH="$runtime:$runtime/checks" python3 -B -m unittest -v \
              checks.test_entrypoint_deadline \
              checks.test_entrypoint_clock.EntryClock \
              checks.test_entrypoint_route_capsule \
              checks.test_final_market_pressure_entrypoint
            PYTHONPATH="$runtime:$runtime/checks" python3 -O -B -m unittest -v \
              checks.test_entrypoint_deadline \
              checks.test_entrypoint_clock.EntryClock \
              checks.test_entrypoint_route_capsule \
              checks.test_final_market_pressure_entrypoint
          )
