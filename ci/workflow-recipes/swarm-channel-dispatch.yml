name: swarm-channel-dispatch

on:
  pull_request:
    paths:
      - 'host/swarm_channel_dispatch.py'
      - 'tests/test_swarm_channel_dispatch.py'
      - 'tests/test_swarm_channel_dispatch_target_cardinality.py'
      - 'ground/SWARM_CHANNEL_DISPATCH.md'
      - '.github/workflows/swarm-channel-dispatch.yml'
  push:
    branches: [main]
    paths:
      - 'host/swarm_channel_dispatch.py'
      - 'tests/test_swarm_channel_dispatch.py'
      - 'tests/test_swarm_channel_dispatch_target_cardinality.py'
      - 'ground/SWARM_CHANNEL_DISPATCH.md'
      - '.github/workflows/swarm-channel-dispatch.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        optimize: ['', '-O']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run dispatcher tests
        env:
          PYTHONOPTIMIZE_FLAG: ${{ matrix.optimize }}
        run: >-
          python $PYTHONOPTIMIZE_FLAG -m unittest
          tests.test_swarm_channel_dispatch
          tests.test_swarm_channel_dispatch_target_cardinality
          -v
