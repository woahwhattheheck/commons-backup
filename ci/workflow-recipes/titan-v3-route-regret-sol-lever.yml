name: TITAN V3 exact route-checkpoint regret — SOL-LEVER

on:
  pull_request:
    paths:
      - ".github/workflows/titan-v3-route-regret-sol-lever.yml"
      - "revenue/kaggriculture/cloud-route-regret/**"
  workflow_dispatch:
    inputs:
      development_seeds:
        description: "Comma-separated development seeds"
        required: true
        default: "2609104101,2609104102"
      holdout_seeds:
        description: "Comma-separated untouched holdout seeds"
        required: true
        default: "2609104201,2609104202"

permissions:
  contents: read
  issues: write

concurrency:
  group: titan-v3-route-regret-sol-lever-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  route-checkpoint-regret:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CASE: revenue/kaggriculture/cloud-route-regret
      LAB: revenue/kaggriculture/cloud-execution-lab
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      EVENT_BASE: ${{ github.event.pull_request.base.sha || '' }}
      DEVELOPMENT_SEEDS: ${{ github.event_name == 'workflow_dispatch' && inputs.development_seeds || '2609104101,2609104102' }}
      HOLDOUT_SEEDS: ${{ github.event_name == 'workflow_dispatch' && inputs.holdout_seeds || '2609104201,2609104202' }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind actual ancestry and additive experiment scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if test -n "$EVENT_BASE"; then
            TARGET="$EVENT_BASE"
          else
            git fetch --no-tags origin main
            TARGET="origin/main"
          fi
          BASE="$(git merge-base "$TARGET" HEAD)"
          test -n "$BASE"
          count="$(git rev-list --count "$BASE"..HEAD)"
          test "$count" -ge 1
          test "$count" -le 5
          test -z "$(git diff --diff-filter=D --name-only "$BASE"...HEAD)"
          unexpected="$(
            git diff --name-only "$BASE"...HEAD |
            grep -Ev '^(\.github/workflows/titan-v3-route-regret-sol-lever\.yml|revenue/kaggriculture/cloud-route-regret/.*)$' || true
          )"
          test -z "$unexpected" || {
            printf 'Unexpected changed paths:\n%s\n' "$unexpected"
            exit 1
          }
          test -f .github/workflows/titan-v3-route-regret-sol-lever.yml
          for file in README.md SOURCE.json source_contract.py route_arm.py panel_engine.py thresholds.py run_panel.py test_route_arm.py test_thresholds.py test_source_contract.py; do
            test -f "$CASE/$file"
          done
          git diff --check "$BASE"...HEAD
          test -z "$(git status --short)"
          printf '%s\n' "$TARGET" > "$RUNNER_TEMP/ACTUAL-TARGET.txt"
          printf '%s\n' "$BASE" > "$RUNNER_TEMP/ACTUAL-MERGE-BASE.txt"
          printf '%s\n' "$EXPECTED_HEAD" > "$RUNNER_TEMP/EXACT-HEAD.txt"
          git diff --name-status "$BASE"...HEAD > "$RUNNER_TEMP/EXACT-DIFF.txt"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned interpreter dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7'

      - name: Compile and run fail-closed unit contracts
        working-directory: ${{ env.CASE }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile *.py
          python -m unittest -v \
            test_source_contract.py \
            test_route_arm.py \
            test_thresholds.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --exit-code -- .
          test -z "$(git status --short)"

      - name: Verify exact current-V3 source closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sol-lever"
          python "$CASE/source_contract.py" \
            --output "$RUNNER_TEMP/sol-lever/SOURCE-RECEIPT.json"
          git diff --exit-code -- .
          test -z "$(git status --short)"

      - name: Prove canonical package remains unchanged
        working-directory: ${{ env.LAB }}
        shell: bash
        run: |
          set -euo pipefail
          python build_integrated.py --check
          git diff --exit-code -- .
          test -z "$(git status --short)"

      - name: Run complete paired route-regret panel
        id: panel
        shell: bash
        run: |
          set +e
          python "$CASE/run_panel.py" \
            --runner-head "$EXPECTED_HEAD" \
            --development-seeds "$DEVELOPMENT_SEEDS" \
            --holdout-seeds "$HOLDOUT_SEEDS" \
            --rng-seed 20260910 \
            --action-timeout 1.25 \
            --startup-timeout 20.0 \
            --game-timeout 240.0 \
            --minimum-holdout-cells 4 \
            --output "$RUNNER_TEMP/sol-lever/RESULTS.json" \
            --markdown "$RUNNER_TEMP/sol-lever/RESULTS.md"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish exact verdict
        if: always()
        shell: bash
        run: |
          {
            echo "## SOL-LEVER — exact route-checkpoint regret"
            echo
            echo "- exact head: \`$EXPECTED_HEAD\`"
            echo "- panel process status: \`${{ steps.panel.outputs.status || 'missing' }}\`"
            echo
            if test -f "$RUNNER_TEMP/sol-lever/RESULTS.md"; then
              cat "$RUNNER_TEMP/sol-lever/RESULTS.md"
            else
              echo "No complete panel verdict was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mirror exact verdict to the PR conversation
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          RESULTS_MD: ${{ runner.temp }}/sol-lever/RESULTS.md
          PANEL_STATUS: ${{ steps.panel.outputs.status || 'missing' }}
          EXACT_HEAD_FOR_COMMENT: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- titan-v3-route-regret-sol-lever -->';
            const path = process.env.RESULTS_MD;
            let detail = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : 'No complete panel verdict was produced.';
            if (detail.length > 58000) detail = detail.slice(0, 58000) + '\n\n[truncated]';
            const body = [
              marker,
              detail,
              '',
              `- Exact head: \`${process.env.EXACT_HEAD_FOR_COMMENT}\``,
              `- Panel process status: \`${process.env.PANEL_STATUS}\``,
              '- Structural workflow success is not promotion authority.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const prior = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (prior) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: prior.id, body
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v3-route-regret-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/ACTUAL-TARGET.txt
            ${{ runner.temp }}/ACTUAL-MERGE-BASE.txt
            ${{ runner.temp }}/EXACT-HEAD.txt
            ${{ runner.temp }}/EXACT-DIFF.txt
            ${{ runner.temp }}/sol-lever/

      - name: Enforce evidence completeness without laundering gameplay verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.panel.outputs.status || 'missing' }}" = "0"
          python - "$RUNNER_TEMP/sol-lever/RESULTS.json" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          assert data["status"] == "complete", data.get("status")
          seeds = data["development_seeds"] + data["holdout_seeds"]
          expected_games = len(seeds) * 2 * 2 * 7
          expected_pairs = len(seeds) * 2 * 2 * 3
          summary = data["summary"]
          assert summary["games"] == expected_games, (summary["games"], expected_games)
          assert len(data["games"]) == expected_games, len(data["games"])
          assert all(game["status"] == "complete" for game in data["games"])
          assert all(game["steps"] == 719 for game in data["games"])
          assert summary["eligible_pairs"] == expected_pairs, (
              summary["eligible_pairs"], expected_pairs
          )
          assert summary["rejected_pairs"] == 0, data["rejected_pairs"][:3]
          assert summary["verdict"] in {
              "NO_THRESHOLD_CHANGE",
              "THRESHOLD_CANDIDATE_SCREEN",
          }, summary["verdict"]
          print(json.dumps({
              "verdict": summary["verdict"],
              "games": summary["games"],
              "eligible_pairs": summary["eligible_pairs"],
              "candidate_checkpoints": summary["threshold_fit"]["candidate_checkpoints"],
          }, sort_keys=True))
          PY
