name: TITAN V4 COBUY 719 authored collision atlas

on:
  pull_request:
    paths:
      - '.github/workflows/titan-v4-cobuy-719-atlas.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v4/research/market-baseline/cobuy_719_collision_atlas.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v4/research/market-baseline/test_cobuy_719_collision_atlas.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v4/research/market-baseline/cobuy_opening_collision.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v4/research/market-baseline/COBUY-CURRENT-NATIVE-OPENING.json'
      - 'revenue/kaggriculture/cloud-execution-lab/reference/engine/kaggriculture.py'

permissions:
  contents: read

jobs:
  exact-source-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert literal pull-request head custody
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          echo "HEAD_SHA=$actual"
          test "$actual" = "$expected"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused tests
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v4/research/market-baseline
        run: |
          python -B test_cobuy_719_collision_atlas.py -v
          python -O -B test_cobuy_719_collision_atlas.py -v
          python -m py_compile cobuy_719_collision_atlas.py test_cobuy_719_collision_atlas.py cobuy_opening_collision.py
      - name: Exact 719-step authored atlas
        run: |
          python revenue/kaggriculture/cloud-execution-lab/candidates/v4/research/market-baseline/cobuy_719_collision_atlas.py --output /tmp/cobuy-719.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('/tmp/cobuy-719.json')
          data = p.read_bytes()
          d = json.loads(data)
          print('ATLAS_SHA256=' + hashlib.sha256(data).hexdigest())
          print('ATLAS_BYTES=' + str(len(data)))
          print('STATUS=' + d['status'])
          print('COUNTS=' + json.dumps(d['counts'], sort_keys=True, separators=(',', ':')))
          print('NOVEL=' + json.dumps(d['novel_authoritative_collisions'], sort_keys=True, separators=(',', ':')))
          print('AUTHORITATIVE=' + json.dumps(d['authoritative_collisions'], sort_keys=True, separators=(',', ':')))
          print('OPENING_CONTROL=' + json.dumps(d['controls'], sort_keys=True, separators=(',', ':')))
          print('SOURCE_BLOBS=' + json.dumps(d['source_blobs'], sort_keys=True, separators=(',', ':')))
          PY
