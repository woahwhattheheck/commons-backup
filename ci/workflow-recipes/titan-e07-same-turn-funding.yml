name: titan-e07-same-turn-funding

on:
  pull_request:
    paths:
      - ".github/workflows/titan-e07-same-turn-funding.yml"
      - "revenue/kaggriculture/cloud-execution-lab/frozen_selected.py"
      - "revenue/kaggriculture/cloud-execution-lab/test_e07_same_turn_funding.py"
      - "revenue/kaggriculture/cloud-execution-lab/test_e07_hosted_source_path.py"
      - "revenue/kaggriculture/cloud-quickstep/seller_snapshot.py"
      - "revenue/kaggriculture/cloud-runtime-pulse/observed_clone.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titan-e07-same-turn-funding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Source-path E07 import without packaged tarball
        working-directory: revenue/kaggriculture/cloud-execution-lab
        env:
          PYTHONPATH: ${{ github.workspace }}/revenue/kaggriculture/cloud-runtime-pulse:${{ github.workspace }}/revenue/kaggriculture/cloud-quickstep:${{ github.workspace }}/revenue/kaggriculture/cloud-execution-lab
        run: |
          python3 -B -m unittest -v \
            test_e07_hosted_source_path \
            test_e07_same_turn_funding \
            test_joint_market_slots

      - name: Mount canonical runtime support
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          mkdir -p "$RUNNER_TEMP/e07-runtime"
          tar -xzf exports/titan-current.tar.gz -C "$RUNNER_TEMP/e07-runtime"
          test -f "$RUNNER_TEMP/e07-runtime/observed_clone.py"
          test -f "$RUNNER_TEMP/e07-runtime/seller_snapshot.py"
          test -f "$RUNNER_TEMP/e07-runtime/scheduler.py"

      - name: Focused E07 and neighboring market contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          PYTHONPATH="$PWD:$PWD/../cloud-quickstep:$PWD/../cloud-runtime-pulse:$RUNNER_TEMP/e07-runtime" \
            python3 -B -m unittest -v \
              test_e07_hosted_source_path \
              test_e07_same_turn_funding \
              test_joint_market_slots

      - name: Rebuild and verify deterministic current release
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          python3 -B build_integrated.py | tee "$RUNNER_TEMP/e07-build.json"
          python3 -B build_integrated.py --check | tee "$RUNNER_TEMP/e07-check.json"

      - name: Bind regenerated bytes to the runner checkout
        shell: python
        env:
          LAB: revenue/kaggriculture/cloud-execution-lab
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          root = pathlib.Path(os.environ["LAB"])
          current = root / "exports/titan-current.tar.gz"
          source = root / "runtime/integrated-selected/CURRENT-SOURCE.json"
          receipt = root / "runtime/integrated-selected/CURRENT-ARCHIVE.json"
          payload = {
              "checkout": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "workflow_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "generated": {},
              "changed_paths": subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True
              ).splitlines(),
          }
          for path in (current, source, receipt):
              data = path.read_bytes()
              payload["generated"][str(path)] = {
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "e07-release"
          out.mkdir()
          (out / "VM-RECEIPT.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          for path in (current, source, receipt):
              dest = out / path.name
              dest.write_bytes(path.read_bytes())

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-e07-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e07-release/
          if-no-files-found: warn
          retention-days: 7
