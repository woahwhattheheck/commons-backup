name: Pursuit evidence bridge

on:
  pull_request:
    paths:
      - 'revenue/pursuit_evidence_bridge/**'
      - 'revenue/bidder_qualification_vault/**'
      - 'opportunities/jersey_connecting_health_cdr_openehr_dn827803/sources.json'
      - 'opportunities/jersey_connecting_health_cdr_openehr_dn827803/fixtures/public_hold.json'
      - 'opportunities/jersey_connecting_health_cdr_openehr_dn827803/fixtures/public_hold.expected.json'
      - 'opportunities/jersey_connecting_health_cdr_openehr_dn827803/qualify.py'
      - 'opportunities/jersey_connecting_health_cdr_openehr_dn827803/tests/**'
      - '.github/workflows/pursuit-evidence-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/pursuit_evidence_bridge/**'
      - 'revenue/bidder_qualification_vault/**'
      - 'opportunities/jersey_connecting_health_cdr_openehr_dn827803/sources.json'
      - 'opportunities/jersey_connecting_health_cdr_openehr_dn827803/fixtures/public_hold.json'
      - 'opportunities/jersey_connecting_health_cdr_openehr_dn827803/fixtures/public_hold.expected.json'
      - 'opportunities/jersey_connecting_health_cdr_openehr_dn827803/qualify.py'
      - 'opportunities/jersey_connecting_health_cdr_openehr_dn827803/tests/**'
      - '.github/workflows/pursuit-evidence-bridge.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: >-
          python -m py_compile
          revenue/pursuit_evidence_bridge/*.py
          revenue/bidder_qualification_vault/*.py
          opportunities/jersey_connecting_health_cdr_openehr_dn827803/qualify.py
          opportunities/jersey_connecting_health_cdr_openehr_dn827803/tests/test_qualify.py
      - name: Unit tests
        run: >-
          python -m unittest -v
          revenue.bidder_qualification_vault.test_vault
          revenue.pursuit_evidence_bridge.test_bridge
          revenue.pursuit_evidence_bridge.test_current_clock_custody
      - name: Optimized unit tests
        run: >-
          python -O -m unittest -v
          revenue.bidder_qualification_vault.test_vault
          revenue.pursuit_evidence_bridge.test_bridge
          revenue.pursuit_evidence_bridge.test_current_clock_custody
      - name: Jersey legacy authority retirement
        run: python -m unittest discover -s opportunities/jersey_connecting_health_cdr_openehr_dn827803/tests -v
      - name: Jersey legacy authority retirement optimized
        run: python -O -m unittest discover -s opportunities/jersey_connecting_health_cdr_openehr_dn827803/tests -v
