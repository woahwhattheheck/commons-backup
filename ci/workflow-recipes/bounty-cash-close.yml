name: Bounty cash close board

on:
  pull_request:
    paths:
      - "revenue/bounty_cash_close/**"
      - "test_bounty_cash_close.py"
      - ".github/workflows/bounty-cash-close.yml"
  push:
    branches: [main]
    paths:
      - "revenue/bounty_cash_close/**"
      - "test_bounty_cash_close.py"
      - ".github/workflows/bounty-cash-close.yml"

permissions:
  contents: read

jobs:
  close-board:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax
        run: python -m py_compile revenue/bounty_cash_close/*.py test_bounty_cash_close.py
      - name: Hostile suite
        run: python -m unittest -v test_bounty_cash_close
      - name: Optimized hostile suite
        run: python -O -m unittest -v test_bounty_cash_close
