name: Muse publication selection

on:
  pull_request:
    paths:
      - "tools/outbound_send_guard/muse_selection_gate.py"
      - "tools/outbound_send_guard/test_muse_selection_gate.py"
      - "tools/outbound_send_guard/MUSE_SELECTION_GATE.md"
      - ".github/workflows/muse-publication-selection.yml"
  push:
    branches:
      - main
    paths:
      - "tools/outbound_send_guard/muse_selection_gate.py"
      - "tools/outbound_send_guard/test_muse_selection_gate.py"
      - "tools/outbound_send_guard/MUSE_SELECTION_GATE.md"
      - ".github/workflows/muse-publication-selection.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile tools/outbound_send_guard/muse_selection_gate.py tools/outbound_send_guard/test_muse_selection_gate.py
      - name: Unit tests
        run: python -m unittest -v tools.outbound_send_guard.test_muse_selection_gate
      - name: Optimized unit tests
        run: python -O -m unittest -v tools.outbound_send_guard.test_muse_selection_gate
