name: Delivery Backplanner

on:
  pull_request:
    paths:
      - 'revenue/delivery_backplanner/**'
      - 'tests/test_delivery_backplanner.py'
      - '.github/workflows/delivery-backplanner.yml'
  push:
    paths:
      - 'revenue/delivery_backplanner/**'
      - 'tests/test_delivery_backplanner.py'
      - '.github/workflows/delivery-backplanner.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile revenue/delivery_backplanner/*.py tests/test_delivery_backplanner.py
      - name: Unit tests
        run: python -m unittest tests.test_delivery_backplanner -v
      - name: Optimized unit tests
        run: python -O -m unittest tests.test_delivery_backplanner -v
      - name: CLI solve and verify
        run: |
          out="$(mktemp -d)/result"
          python -m revenue.delivery_backplanner solve revenue/delivery_backplanner/example.json "$out"
          python -m revenue.delivery_backplanner verify revenue/delivery_backplanner/example.json "$out/result.json"
