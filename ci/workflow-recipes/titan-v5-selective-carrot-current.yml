name: titan-v5-selective-carrot-current

on:
  pull_request:
    paths:
      - ".github/workflows/titan-v5-selective-carrot-current.yml"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v5/selective-carrot/**"

permissions:
  contents: read

concurrency:
  group: titan-v5-selective-carrot-current-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  carrier-contracts:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Assert exact triggering head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and run current-lineage carrier contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v5/selective-carrot
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -B -m py_compile \
            build_current.py current_entry.py paired_current.py test_current_carrier.py
          python -B -m unittest -v test_current_carrier
          python -O -B -m unittest -v test_current_carrier
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain)"
