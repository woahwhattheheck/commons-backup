name: OHSU ERP source-bound qualification

on:
  push:
    paths:
      - 'revenue/ohsu_erp_rfp_2027_0005/source_bound.py'
      - 'revenue/ohsu_erp_rfp_2027_0005/test_source_bound.py'
      - 'revenue/ohsu_erp_rfp_2027_0005/source_manifest.json'
      - 'revenue/ohsu_erp_rfp_2027_0005/current_position.json'
      - 'revenue/ohsu_erp_rfp_2027_0005/README.md'
      - 'revenue/ohsu_erp_rfp_2027_0005/COMMERCIAL_STATUS.md'
      - '.github/workflows/ohsu-erp-rfp-source-bound.yml'
  pull_request:
    paths:
      - 'revenue/ohsu_erp_rfp_2027_0005/source_bound.py'
      - 'revenue/ohsu_erp_rfp_2027_0005/test_source_bound.py'
      - 'revenue/ohsu_erp_rfp_2027_0005/source_manifest.json'
      - 'revenue/ohsu_erp_rfp_2027_0005/current_position.json'
      - 'revenue/ohsu_erp_rfp_2027_0005/README.md'
      - 'revenue/ohsu_erp_rfp_2027_0005/COMMERCIAL_STATUS.md'
      - '.github/workflows/ohsu-erp-rfp-source-bound.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile revenue/ohsu_erp_rfp_2027_0005/qualification.py revenue/ohsu_erp_rfp_2027_0005/source_bound.py revenue/ohsu_erp_rfp_2027_0005/test_source_bound.py
      - name: Original carrier regression
        run: python -m unittest revenue.ohsu_erp_rfp_2027_0005.test_qualification
      - name: Source-bound tests
        run: python -m unittest revenue.ohsu_erp_rfp_2027_0005.test_source_bound
      - name: Original optimized regression
        run: python -O -m unittest revenue.ohsu_erp_rfp_2027_0005.test_qualification
      - name: Source-bound optimized tests
        run: python -O -m unittest revenue.ohsu_erp_rfp_2027_0005.test_source_bound
