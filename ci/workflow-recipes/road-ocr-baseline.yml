name: road-ocr-baseline

on:
  pull_request:
    paths:
      - "revenue/road_barbados_ocr/**"
      - ".github/workflows/road-ocr-baseline.yml"
  push:
    branches: [main]
    paths:
      - "revenue/road_barbados_ocr/**"
      - ".github/workflows/road-ocr-baseline.yml"

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr
          python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Run focused real-engine tests
        run: |
          python -m unittest discover -s revenue/road_barbados_ocr -p 'test_*.py' -v
          python -m py_compile revenue/road_barbados_ocr/baseline.py
