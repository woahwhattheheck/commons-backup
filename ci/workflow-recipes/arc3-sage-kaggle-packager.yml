name: ARC3 SAGE offline Kaggle packager
on:
  pull_request:
    paths:
      - 'competitions/arc-agi-3-2026/kaggle/**'
      - '.github/workflows/arc3-sage-kaggle-packager.yml'
  push:
    branches: [main]
    paths:
      - 'competitions/arc-agi-3-2026/kaggle/**'
      - '.github/workflows/arc3-sage-kaggle-packager.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        working-directory: competitions/arc-agi-3-2026
        run: python -m compileall -q kaggle
      - name: Unit tests
        working-directory: competitions/arc-agi-3-2026
        run: python -m unittest discover -s kaggle/tests -p 'test_*.py'
      - name: Optimized-mode tests
        working-directory: competitions/arc-agi-3-2026
        run: python -O -m unittest discover -s kaggle/tests -p 'test_*.py'
