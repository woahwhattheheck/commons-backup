name: ARC3 SAGE

on:
  pull_request:
    paths:
      - 'competitions/arc-agi-3-2026/**'
      - '.github/workflows/arc3-sage-ci.yml'
  push:
    branches: [main]
    paths:
      - 'competitions/arc-agi-3-2026/**'
      - '.github/workflows/arc3-sage-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile competitions/arc-agi-3-2026/*.py
      - name: Unit tests
        working-directory: competitions/arc-agi-3-2026
        run: python -m unittest -q
      - name: Optimized tests
        working-directory: competitions/arc-agi-3-2026
        run: python -O -m unittest -q
      - name: Offline benchmark smoke
        working-directory: competitions/arc-agi-3-2026
        run: python benchmark.py --seeds 12 --max-actions 80
