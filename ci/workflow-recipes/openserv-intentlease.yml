name: OpenServ IntentLease proof

on:
  push:
    paths:
      - 'competitions/openserv2026_intentlease/**'
      - '.github/workflows/openserv-intentlease.yml'
  pull_request:
    paths:
      - 'competitions/openserv2026_intentlease/**'
      - '.github/workflows/openserv-intentlease.yml'

permissions:
  contents: read

jobs:
  deterministic-proof:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: competitions/openserv2026_intentlease
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static syntax checks
        run: npm run check
      - name: Hostile lease tests
        run: npm test
