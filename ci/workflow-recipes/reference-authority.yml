name: reference-authority

on:
  pull_request:
    paths:
      - 'revenue/reference_authority/**'
      - 'test_reference_authority.py'
      - '.github/workflows/reference-authority.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/reference_authority/**'
      - 'test_reference_authority.py'
      - '.github/workflows/reference-authority.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile
        run: python -m py_compile revenue/reference_authority/reference_authority.py test_reference_authority.py
      - name: Unit and hostile tests
        run: python -m unittest -v test_reference_authority.py
      - name: Optimized-mode hostile tests
        run: python -O -m unittest -v test_reference_authority.py
