name: titan-e06-mixed-empty-slot

on:
  pull_request:
    paths:
      - '.github/workflows/titan-e06-mixed-empty-slot.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/e06_mixed_empty_slot.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_e06_mixed_empty_slot.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  mixed-empty-slot:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run E06 mixed-prefix contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          python3 -m py_compile e06_mixed_empty_slot.py test_e06_mixed_empty_slot.py
          python3 -B -m unittest -v test_e06_mixed_empty_slot.py
