name: organization-contact-pressure

on:
  pull_request:
    paths:
      - "revenue/organization_contact_pressure/**"
      - ".github/workflows/organization-contact-pressure.yml"
  push:
    branches: [main]
    paths:
      - "revenue/organization_contact_pressure/**"
      - ".github/workflows/organization-contact-pressure.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q revenue/organization_contact_pressure
      - name: Tests
        run: python -m unittest discover -v -s revenue/organization_contact_pressure -t . -p 'test_*.py'
      - name: Optimized tests
        run: python -O -m unittest discover -v -s revenue/organization_contact_pressure -t . -p 'test_*.py'
