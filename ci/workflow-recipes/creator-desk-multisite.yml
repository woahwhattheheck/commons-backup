name: Creator Desk multisite

on:
  pull_request:
    paths:
      - "revenue/hive/creator-toolkit/**"
      - ".github/workflows/creator-desk-multisite.yml"
  push:
    branches: [main]
    paths:
      - "revenue/hive/creator-toolkit/**"
      - ".github/workflows/creator-desk-multisite.yml"

permissions:
  contents: read

jobs:
  hostile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: revenue/hive/creator-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile multisite control plane
        run: python -m py_compile multisite.py multisite_registry.py multisite_runtime.py test_multisite.py test_multisite_security.py
      - name: Normal interpreter
        run: python -m unittest -v test_multisite test_multisite_security test_toolkit test_operator_auth test_workspace_copy
      - name: Optimized interpreter
        run: python -O -m unittest -v test_multisite test_multisite_security test_toolkit test_operator_auth test_workspace_copy
      - name: Operator auth fetch contract
        run: |
          node --check operator_auth.js
          node --test test_operator_auth_fetch.cjs
