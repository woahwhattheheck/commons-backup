name: Commercial terms lineage

on:
  pull_request:
    paths:
      - 'revenue/commercial_terms_lineage/**'
      - '.github/workflows/commercial-terms-lineage.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/commercial_terms_lineage/**'
      - '.github/workflows/commercial-terms-lineage.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        working-directory: revenue/commercial_terms_lineage
        run: python -B -m py_compile lineage.py policy.py runtime.py cli.py test_lineage.py test_runtime.py
      - name: Hostile suite
        working-directory: revenue/commercial_terms_lineage
        run: python -B -m unittest -v test_lineage.py test_runtime.py
      - name: Optimized hostile suite
        working-directory: revenue/commercial_terms_lineage
        run: python -O -B -m unittest -v test_lineage.py test_runtime.py
