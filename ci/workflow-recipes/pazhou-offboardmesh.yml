name: pazhou-offboardmesh

on:
  push:
    paths:
      - "competitions/pazhou_overseas_offboardmesh_2026/**"
      - "tests/test_pazhou_offboardmesh*.py"
      - ".github/workflows/pazhou-offboardmesh.yml"
  pull_request:
    paths:
      - "competitions/pazhou_overseas_offboardmesh_2026/**"
      - "tests/test_pazhou_offboardmesh*.py"
      - ".github/workflows/pazhou-offboardmesh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m py_compile competitions/pazhou_overseas_offboardmesh_2026/offboardmesh.py competitions/pazhou_overseas_offboardmesh_2026/rubric.py
      - name: Run hostile tests
        run: python -m unittest discover -s tests -p 'test_pazhou_offboardmesh*.py' -v
      - name: Run hostile tests optimized
        run: python -O -m unittest discover -s tests -p 'test_pazhou_offboardmesh*.py' -v
      - name: Run rubric audit
        run: python competitions/pazhou_overseas_offboardmesh_2026/rubric.py
