name: Diversey proof-of-clean release fence

on:
  pull_request:
    paths:
      - 'competitions/diversey-proof-clean-2026/**'
      - '.github/workflows/diversey-proof-clean.yml'
  push:
    branches: [main]
    paths:
      - 'competitions/diversey-proof-clean-2026/**'
      - '.github/workflows/diversey-proof-clean.yml'

permissions:
  contents: read

jobs:
  authority-hostiles:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: competitions/diversey-proof-clean-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile validator and hostile suite
        run: python -m py_compile validate_submission.py test_validate_submission.py
      - name: Baseline candidate must remain structurally valid and blocked
        run: python validate_submission.py
      - name: Run authority, descriptor, deadline, and provider-event hostiles
        run: python -m unittest -v test_validate_submission.py
      - name: Require-ready must fail closed before human owner release
        run: |
          set +e
          python validate_submission.py --require-ready
          code=$?
          set -e
          test "$code" -eq 2
