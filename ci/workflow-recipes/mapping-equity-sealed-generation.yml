name: Mapping Equity sealed generation

on:
  pull_request:
    paths:
      - 'revenue/bias-bounty-mapping-equity/aggregation/**'
      - '.github/workflows/mapping-equity-sealed-generation.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/bias-bounty-mapping-equity/aggregation/**'
      - '.github/workflows/mapping-equity-sealed-generation.yml'

permissions:
  contents: read

jobs:
  authority-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: revenue/bias-bounty-mapping-equity/aggregation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile exact carrier bytes
        run: python -m py_compile aggregate.py _aggregate_unsealed.py _zsa_d6p2_core.py test_aggregate.py test_recovery.py test_memfd_seal.py test_redirect_provenance.py
      - name: Contract and predecessor-killer tests
        run: python -m unittest -v test_aggregate.py test_recovery.py test_memfd_seal.py test_redirect_provenance.py
      - name: Optimized contract and predecessor-killer tests
        run: python -O -m unittest -v test_aggregate.py test_recovery.py test_memfd_seal.py test_redirect_provenance.py
