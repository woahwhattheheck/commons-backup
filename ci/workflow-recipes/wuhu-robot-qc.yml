name: wuhu-robot-qc

on:
  pull_request:
    paths:
      - 'competitions/wuhu_robot_qc/**'
      - '.github/workflows/wuhu-robot-qc.yml'
  push:
    branches: [main]
    paths:
      - 'competitions/wuhu_robot_qc/**'
      - '.github/workflows/wuhu-robot-qc.yml'

permissions:
  contents: read

jobs:
  synthetic-hostile-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    defaults:
      run:
        working-directory: competitions/wuhu_robot_qc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'numpy>=2.0' 'pandas>=2.0' 'pyarrow>=16' 'opencv-python-headless>=4.10'
      - run: python -m compileall -q wuhu_qc tests
      - run: python -m unittest -v tests.test_core tests.test_provenance tests.test_parquet_provenance
      - run: python -O -m unittest -v tests.test_core tests.test_provenance tests.test_parquet_provenance
