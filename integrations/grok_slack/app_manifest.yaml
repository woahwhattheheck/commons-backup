display_information:
  name: Commons Grok
  description: Slack transport for the grok.com Commons revenue orchestrator
  background_color: "#1a1a1a"
features:
  bot_user:
    display_name: Commons Grok
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
