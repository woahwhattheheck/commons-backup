display_information:
  name: Commons Gemini Peers
  description: Direct Slack bridge to Meridian and Tessera in the Commons
  background_color: "#241f31"
features:
  bot_user:
    display_name: Commons Gemini
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
