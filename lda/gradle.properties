android.useAndroidX=true

# Jetifier rewrites legacy android.support.* references inside EVERY dependency
# artifact at build time. All of our deps (appcompat, litertlm, coroutines, vosk)
# are already AndroidX-native, so this only burned ~tens of minutes unzipping and
# rewriting the large LiteRT/vosk native AARs for nothing. Off = much faster builds.
android.enableJetifier=false

# Build performance. The CI build was taking ~88 min: a chunk of that was the
# Kotlin daemon GC-thrashing on the default ~512MB heap (compileDebugKotlin alone
# was ~27 min for 23 files). Give it real memory, build in parallel, and turn on
# the build cache so unchanged work is reused across builds.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
kotlin.daemon.jvmargs=-Xmx2g
kotlin.incremental=true
