name: Android Build
on: [push, workflow_dispatch]
permissions:
  contents: read
  actions: write          # needed to delete old artifacts
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts older than 3 hours
        continue-on-error: true     # auxiliary cleanup must never fail the build
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 3 * 60 * 60 * 1000;   // 3 hours
            const arts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100 });
            let n = 0;
            for (const a of arts) {
              if (new Date(a.created_at).getTime() < cutoff) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id });
                n++;
              }
            }
            core.info(`Deleted ${n} artifact(s) older than 3 hours.`);
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
          # By default this action only SAVES the Gradle cache on the default
          # branch, so every push to a feature branch rebuilt completely cold
          # (re-downloading LiteRT/vosk, re-running all tasks). Save on this
          # branch too so the second build onward reuses dependencies + outputs.
          cache-read-only: false
      - name: Build with Gradle
        run: gradle :app:assembleDebug --build-cache
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          # Primary cleanup is the "Delete artifacts older than 3 hours" step above, which runs on
          # every build (GitHub's retention-days can't go below 1 day). retention-days:1 is just the
          # backstop if no later build runs. Download the APK soon after the build; a re-run
          # regenerates it any time.
          retention-days: 1